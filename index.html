                            matchedIds: []
                        });
                        i += groupSize;
                        continue;
                    }

                    const word = words[i];
                    const distractors = allPool.filter(w => w.id !== word.id).sort(() => Math.random() - 0.5).slice(0, 3);
                    const actualType = qType === 'match' ? 'mc' : qType;

                    if (actualType === 'mc') {
                        const options = [word, ...distractors].sort(() => Math.random() - 0.5).map(w => ({
                            id: w.id,
                            pos: w.pos || '',
                            meaning: w.meaning || w.hanViet || '(Chưa có nghĩa)',
                            label: formatPosAndMeaning(w)
                        }));
                        questions.push({ type: 'mc', word, options, correctId: word.id });
                    } else if (actualType === 'tf') {
                        const isTrue = Math.random() > 0.45 || distractors.length === 0;
                        const shownWord = isTrue ? word : distractors[0];
                        questions.push({
                            type: 'tf',
                            word,
                            shownPos: shownWord.pos || '',
                            shownMeaning: shownWord.meaning || shownWord.pinyin,
                            isTrue
                        });
                    } else {
                        questions.push({ type: 'written', word });
                    }
                    i++;
                }
                return questions;
            }

            function openSetup(mode = 'quiz', sourceType = 'all', sourceValue = '') {
                state.active = false;
                state.mode = mode;
                state.sourceType = sourceType;
                state.sourceValue = sourceValue;
            }

            function start(sourceType, sourceValue, count = 20, options = {}) {
                const data = Storage.load();
                const words = getWordsFromSource(sourceType, sourceValue);

                if (words.length < 2) {
                    UI.showToast("Cần ít nhất 2 từ vựng trong nguồn đã chọn!", "error");
                    return false;
                }

                const isLearnMode = options.mode === 'learn';
                const allPool = data.words.length >= 4 ? data.words : words;

                if (isLearnMode) {
                    const shuffledAll = [...words].sort(() => Math.random() - 0.5);
                    const firstChunk = shuffledAll.slice(0, CHUNK_SIZE);
                    const restPool = shuffledAll.slice(CHUNK_SIZE);
                    const questions = buildQuestionsForWords(firstChunk, allPool, ['mc']);

                    state = {
                        ...state,
                        active: true,
                        mode: 'learn',
                        sourceType,
                        sourceValue,
                        learnTwoStage: true,
                        currentStage: 1,
                        chunkIndex: 1,
                        remainingPool: restPool,
                        currentChunkWords: firstChunk,
                        chunkFailedMap: {},
                        selectedWords: shuffledAll,
                        questions,
                        currentIndex: 0,
                        score: 0,
                        wrongWords: [],
                        answeredCurrent: false,
                        lastAnswerCorrect: false,
                        lastUserAnswer: ''
                    };
                    return true;
                }

                const cappedCount = Math.min(Math.max(1, count), 60, words.length);
                const chosenWords = [...words].sort(() => Math.random() - 0.5).slice(0, cappedCount);

                let allowedTypes = [];
                if (options.mc) allowedTypes.push('mc');
                if (options.written) allowedTypes.push('written');
                if (options.tf) allowedTypes.push('tf');
                if (options.match) allowedTypes.push('match');
                if (allowedTypes.length === 0) allowedTypes = ['mc'];

                const questions = buildQuestionsForWords(chosenWords, allPool, allowedTypes);

                state = {
                    ...state,
                    active: true,
                    mode: 'quiz',
                    sourceType,
                    sourceValue,
                    learnTwoStage: false,
                    currentStage: 1,
                    chunkIndex: 1,
                    remainingPool: [],
                    currentChunkWords: chosenWords,
                    chunkFailedMap: {},
                    selectedWords: chosenWords,
                    questions,
                    currentIndex: 0,
                    score: 0,
                    wrongWords: [],
                    answeredCurrent: false,
                    lastAnswerCorrect: false,
                    lastUserAnswer: '',
                    config: {
                        count: cappedCount,
                        mc: options.mc ?? true,
                        written: options.written ?? false,
                        tf: options.tf ?? false,
                        match: options.match ?? false
                    }
                };
                return true;
            }

            function startStage2Written() {
                const data = Storage.load();
                const allPool = data.words;
                const shuffledChunk = [...state.currentChunkWords].sort(() => Math.random() - 0.5);
                state.currentStage = 2;
                state.questions = buildQuestionsForWords(shuffledChunk, allPool, ['written']);
                state.currentIndex = 0;
                state.score = 0;
                state.answeredCurrent = false;
                state.lastUserAnswer = '';
                UI.renderView();
                setTimeout(() => document.getElementById('quiz-written-input')?.focus(), 50);
            }

            function startNextLearnChunk() {
                const data = Storage.load();
                const allPool = data.words;
                const carryOverWords = Object.values(state.chunkFailedMap);
                const slotsNeeded = Math.max(0, CHUNK_SIZE - carryOverWords.length);
                const freshFromPool = state.remainingPool.slice(0, slotsNeeded);
                const nextRemaining = state.remainingPool.slice(slotsNeeded);

                const nextChunk = [...carryOverWords, ...freshFromPool].sort(() => Math.random() - 0.5);
                if (nextChunk.length === 0) return;

                state.chunkIndex += 1;
                state.currentStage = 1;
                state.currentChunkWords = nextChunk;
                state.remainingPool = nextRemaining;
                state.chunkFailedMap = {};
                state.questions = buildQuestionsForWords(nextChunk, allPool, ['mc']);
                state.currentIndex = 0;
                state.score = 0;
                state.answeredCurrent = false;
                state.lastUserAnswer = '';
                UI.renderView();
            }

            function selectMatchInQuiz(side, id) {
                const q = state.questions[state.currentIndex];
                if (!q || q.type !== 'match' || state.answeredCurrent) return;
                if (q.matchedIds.includes(id)) return;

                if (side === 'left') {
                    q.selectedLeft = q.selectedLeft === id ? null : id;
                    const item = q.leftItems.find(x => x.id === id);
                    if (item) DictionaryAI.speak(item.hanzi);
                } else {
                    q.selectedRight = q.selectedRight === id ? null : id;
                }

                if (q.selectedLeft && q.selectedRight) {
                    if (q.selectedLeft === q.selectedRight) {
                        DictionaryAI.playFeedbackSound(true);
                        q.matchedIds.push(q.selectedLeft);
                        q.selectedLeft = null;
                        q.selectedRight = null;
                        if (q.matchedIds.length === q.group.length) {
                            state.answeredCurrent = true;
                            state.lastAnswerCorrect = true;
                            state.score++;
                        }
                    } else {
                        DictionaryAI.playFeedbackSound(false);
                        const wrongWord = q.group.find(w => w.id === q.selectedLeft);
                        if (wrongWord && !state.wrongWords.some(w => w.id === wrongWord.id)) {
                            state.wrongWords.push(wrongWord);
                            const data = Storage.load();
                            const dbWord = data.words.find(w => w.id === wrongWord.id);
                            if (dbWord) {
                                dbWord.starred = true;
                                Storage.save(data);
                                UI.renderNoteSidebar();
                            }
                        }
                        q.selectedLeft = null;
                        q.selectedRight = null;
                        UI.showToast("Chưa khớp cặp từ! Thử chọn lại nhé.", "error");
                    }
                }
                UI.renderView();
            }

            function submitAnswer(userVal, isDontKnow = false) {
                if (state.answeredCurrent) return;
                const q = state.questions[state.currentIndex];
                let isCorrect = false;

                if (!isDontKnow) {
                    if (q.type === 'mc') {
                        isCorrect = userVal === q.correctId;
                    } else if (q.type === 'tf') {
                        isCorrect = Boolean(userVal) === q.isTrue;
                    } else if (q.type === 'written') {
                        const cleanInput = String(userVal || '').trim().replace(/\s+/g, '');
                        const targetHanzi = (q.word.hanzi || '').trim().replace(/\s+/g, '');
                        isCorrect = cleanInput.length > 0 && cleanInput === targetHanzi;
                    }
                }

                state.answeredCurrent = true;
                state.lastAnswerCorrect = isCorrect;
                state.lastUserAnswer = isDontKnow ? '(Bỏ qua / Chưa nhớ)' : String(userVal || '');

                DictionaryAI.playFeedbackSound(isCorrect);

                const data = Storage.load();
                const dbWord = data.words.find(w => w.id === q.word.id);
                if (dbWord) {
                    SRS.recordReview(dbWord, isCorrect);
                    if (!isCorrect) {
                        dbWord.starred = true;
                    }
                    Storage.save(data);
                    UI.renderNoteSidebar();
                    UI.updateDailyDueBadge();
                }

                if (isCorrect) {
                    state.score++;
                    setTimeout(() => DictionaryAI.speak(q.word.hanzi), 220);
                } else {
                    if (state.learnTwoStage) {
                        state.chunkFailedMap[q.word.id] = q.word;
                    }
                    if (!state.wrongWords.some(w => w.id === q.word.id)) {
                        state.wrongWords.push(q.word);
                    }
                }

                UI.renderView();
            }

            function next() {
                state.currentIndex++;
                state.answeredCurrent = false;
                state.lastUserAnswer = '';
                UI.renderView();
                setTimeout(() => {
                    const inp = document.getElementById('quiz-written-input');
                    if (inp) inp.focus();
                }, 40);
            }

            function retryWrong() {
                if (state.wrongWords.length === 0) return;
                const wrongIds = new Set(state.wrongWords.map(w => w.id));
                const data = Storage.load();
                const words = data.words.filter(w => wrongIds.has(w.id));
                state.learnTwoStage = false;
                state.questions = buildQuestionsForWords(words, data.words, ['mc', 'written']);
                state.currentIndex = 0;
                state.score = 0;
                state.wrongWords = [];
                state.answeredCurrent = false;
                UI.renderView();
            }

            return {
                getState: () => state,
                getWordsFromSource,
                openSetup,
                start,
                startStage2Written,
                startNextLearnChunk,
                selectMatchInQuiz,
                submitAnswer,
                next,
                retryWrong,
                reset: () => { state.active = false; }
            };
        })();

        /* =====================================================================
           MODULE 8: MATCH GAME (Trò chơi nối từ + tính giờ + bảng kỷ lục)
        ====================================================================== */
        const MatchGame = (() => {
            let state = {
                active: false,
                pairCount: 6,
                leftItems: [],
                rightItems: [],
                selectedLeft: null,
                selectedRight: null,
                matchedIds: new Set(),
                mistakes: 0,
                startTime: 0,
                elapsedSec: 0,
                timerId: null,
                finished: false,
                isNewRecord: false
            };

            function stopTimer() {
                if (state.timerId) {
                    clearInterval(state.timerId);
                    state.timerId = null;
                }
            }

            function start(sourceType, sourceValue, pairCount = 6) {
                stopTimer();
                const data = Storage.load();
                let words = [];
                if (sourceType === 'deck') {
                    const deck = data.decks.find(d => d.id === sourceValue);
                    words = deck ? deck.wordIds.map(id => data.words.find(w => w.id === id)).filter(Boolean) : [];
                } else if (sourceType === 'level') {
                    words = data.words.filter(w => w.level === parseInt(sourceValue, 10));
                } else if (sourceType === 'lesson') {
                    const [lvlStr, ...lessonParts] = sourceValue.split('|');
                    const lessonName = lessonParts.join('|');
                    words = data.words.filter(w => w.level === parseInt(lvlStr, 10) && (w.lesson || 'Bài 1') === lessonName);
                } else if (sourceType === 'daily_date') {
                    const folderIds = data.dailyProgress.dailyFolders?.[sourceValue]?.wordIds || [];
                    words = folderIds.map(id => data.words.find(w => w.id === id)).filter(Boolean);
                } else if (sourceType === 'starred') {
                    words = data.words.filter(w => w.starred);
                } else {
                    words = [...data.words];
                }

                if (words.length < 3) {
                    UI.showToast("Cần ít nhất 3 từ vựng trong nguồn đã chọn để chơi nối từ!", "error");
                    return false;
                }

                const chosen = [...words].sort(() => Math.random() - 0.5).slice(0, Math.min(pairCount, words.length));
                const leftItems = chosen.map(w => ({ id: w.id, hanzi: w.hanzi, pinyin: w.pinyin })).sort(() => Math.random() - 0.5);
                const rightItems = chosen.map(w => ({
                    id: w.id,
                    text: w.meaning || w.hanViet || w.pinyin,
                    sub: w.hanViet ? `Hán Việt: ${w.hanViet}` : ''
                })).sort(() => Math.random() - 0.5);

                state = {
                    active: true,
                    pairCount: chosen.length,
                    leftItems,
                    rightItems,
                    selectedLeft: null,
                    selectedRight: null,
                    matchedIds: new Set(),
                    mistakes: 0,
                    startTime: performance.now(),
                    elapsedSec: 0,
                    timerId: null,
                    finished: false,
                    isNewRecord: false
                };

                state.timerId = setInterval(() => {
                    state.elapsedSec = ((performance.now() - state.startTime) / 1000).toFixed(1);
                    const timerEl = document.getElementById('match-timer-display');
                    if (timerEl) timerEl.textContent = `${state.elapsedSec}s`;
                }, 100);

                return true;
            }

            function selectItem(side, id) {
                if (state.finished || state.matchedIds.has(id)) return;

                if (side === 'left') {
                    state.selectedLeft = state.selectedLeft === id ? null : id;
                    const item = state.leftItems.find(i => i.id === id);
                    if (item) DictionaryAI.speak(item.hanzi);
                } else {
                    state.selectedRight = state.selectedRight === id ? null : id;
                }

                if (state.selectedLeft && state.selectedRight) {
                    if (state.selectedLeft === state.selectedRight) {
                        state.matchedIds.add(state.selectedLeft);
                        state.selectedLeft = null;
                        state.selectedRight = null;

                        if (state.matchedIds.size === state.pairCount) {
                            stopTimer();
                            state.finished = true;
                            const finalTime = parseFloat(state.elapsedSec);
                            const data = Storage.load();
                            const prevBest = data.matchRecords
                                .filter(r => r.pairs === state.pairCount)
                                .sort((a, b) => a.timeSec - b.timeSec)[0];

                            if (!prevBest || finalTime < prevBest.timeSec) {
                                state.isNewRecord = true;
                            }
                            data.matchRecords.push({
                                pairs: state.pairCount,
                                timeSec: finalTime,
                                mistakes: state.mistakes,
                                date: SRS.getTodayStr()
                            });
                            Storage.save(data);
                        }
                    } else {
                        state.mistakes++;
                        const wrongL = state.selectedLeft;
                        const wrongR = state.selectedRight;
                        state.selectedLeft = null;
                        state.selectedRight = null;
                        UI.renderView();
                        document.getElementById(`match-left-${wrongL}`)?.classList.add('animate-shake', 'border-rose-500', 'bg-rose-50');
                        document.getElementById(`match-right-${wrongR}`)?.classList.add('animate-shake', 'border-rose-500', 'bg-rose-50');
                        setTimeout(() => UI.renderView(), 400);
                        return;
                    }
                }

                UI.renderView();
            }

            return {
                getState: () => state,
                start,
                selectItem,
                stopTimer,
                reset: () => { stopTimer(); state.active = false; }
            };
        })();

        /* =====================================================================
           MODULE 9: UI & APP CONTROLLER
        ====================================================================== */
        const UI = (() => {
            let currentView = 'home';
            let viewParams = { level: 1, lessonFilter: 'ALL', textFilter: '' };
            let pendingUploadWords = [];
            let currentActiveHanzi = '';
            let activeModalHanzi = '';

            let navHistory = [];
            let navIndex = -1;

            function normalizePosToEnglish(rawPos) {
                const p = String(rawPos || '').trim().toLowerCase().replace(/\.$/, '');
                const map = {
                    'dt': 'n', 'danh từ': 'n',
                    'đgt': 'v', 'đt': 'v', 'động từ': 'v',
                    'tt': 'adj', 'tính từ': 'adj',
                    'phó': 'adv', 'pt': 'adv', 'phó từ': 'adv',
                    'liên': 'conj', 'lt': 'conj', 'liên từ': 'conj',
                    'giới': 'prep', 'gt': 'prep', 'giới từ': 'prep',
                    'lượng': 'm', 'lượng từ': 'm',
                    'đại': 'pron', 'đại từ': 'pron',
                    'trợ': 'part', 'trợ từ': 'part',
                    'thán': 'int', 'thán từ': 'int',
                    'số': 'num', 'số từ': 'num',
                    'cụm': 'phr', 'thành ngữ': 'idiom'
                };
                return map[p] || rawPos;
            }

            function isBusyEditing() {
                if (currentView === 'upload') return true;
                if (pendingUploadWords.length > 0) return true;
                const wordModal = document.getElementById('word-detail-modal');
                if (wordModal && !wordModal.classList.contains('hidden')) return true;
                const activeTag = document.activeElement?.tagName;
                if (activeTag === 'INPUT' || activeTag === 'TEXTAREA' || activeTag === 'SELECT') return true;
                return false;
            }

            function createSnapshot(view, params) {
                const fcSt = FlashcardModule.getState();
                const qSt = QuizModule.getState();
                return {
                    view,
                    params: JSON.parse(JSON.stringify(params || {})),
                    fcContext: view === 'flashcard' ? {
                        sourceType: fcSt.sourceType,
                        sourceValue: fcSt.sourceValue,
                        shuffle: fcSt.shuffle
                    } : null,
                    quizContext: view === 'quiz' ? {
                        mode: qSt.mode,
                        sourceType: qSt.sourceType,
                        sourceValue: qSt.sourceValue
                    } : null
                };
            }

            function buildHashFromSnapshot(snap) {
                if (snap.view === 'hsk') return `#hsk-${snap.params.level || 1}`;
                if (snap.view === 'quiz') {
                    const qMode = snap.quizContext?.mode || 'quiz';
                    return `#${qMode}`;
                }
                return `#${snap.view}`;
            }

            function updateHistoryButtons() {
                const backBtn = document.getElementById('btn-history-back');
                const fwdBtn = document.getElementById('btn-history-forward');
                if (backBtn) backBtn.disabled = navIndex <= 0;
                if (fwdBtn) fwdBtn.disabled = navIndex >= navHistory.length - 1;
            }

            function applySnapshot(snap) {
                if (!snap) return;
                if (currentView === 'match' && snap.view !== 'match') {
                    MatchGame.stopTimer();
                }

                if (snap.view === 'flashcard' && snap.fcContext) {
                    const curFc = FlashcardModule.getState();
                    if (curFc.sourceType !== snap.fcContext.sourceType || curFc.sourceValue !== snap.fcContext.sourceValue) {
                        FlashcardModule.initSession(snap.fcContext.sourceType, snap.fcContext.sourceValue, snap.fcContext.shuffle);
                    }
                } else if (snap.view === 'quiz' && snap.quizContext) {
                    const curQ = QuizModule.getState();
                    if (!curQ.active && (curQ.mode !== snap.quizContext.mode || curQ.sourceType !== snap.quizContext.sourceType || curQ.sourceValue !== snap.quizContext.sourceValue)) {
                        QuizModule.openSetup(snap.quizContext.mode, snap.quizContext.sourceType, snap.quizContext.sourceValue);
                    }
                }

                currentView = snap.view;
                viewParams = { lessonFilter: 'ALL', textFilter: '', ...(snap.params || {}) };
                updateActiveNavigation();
                updateHistoryButtons();
                renderView();
            }

            function goBack() {
                if (navIndex > 0) {
                    try {
                        window.history.back();
                    } catch (e) {
                        navIndex--;
                        applySnapshot(navHistory[navIndex]);
                    }
                }
            }

            function goForward() {
                if (navIndex < navHistory.length - 1) {
                    try {
                        window.history.forward();
                    } catch (e) {
                        navIndex++;
                        applySnapshot(navHistory[navIndex]);
                    }
                }
            }

            function initHistorySync() {
                window.addEventListener('popstate', (event) => {
                    const state = event.state;
                    if (state && typeof state.navIndex === 'number' && navHistory[state.navIndex]) {
                        navIndex = state.navIndex;
                        applySnapshot(navHistory[navIndex]);
                    } else if (state && state.snapshot) {
                        navHistory.push(state.snapshot);
                        navIndex = navHistory.length - 1;
                        applySnapshot(state.snapshot);
                    }
                });
            }

            const LEVEL_COLORS = {
                1: { bg: 'bg-emerald-500', soft: 'bg-emerald-50 text-emerald-700 border-emerald-200', pill: 'bg-emerald-600 text-white' },
                2: { bg: 'bg-teal-500', soft: 'bg-teal-50 text-teal-700 border-teal-200', pill: 'bg-teal-600 text-white' },
                3: { bg: 'bg-sky-500', soft: 'bg-sky-50 text-sky-700 border-sky-200', pill: 'bg-sky-600 text-white' },
                4: { bg: 'bg-indigo-500', soft: 'bg-indigo-50 text-indigo-700 border-indigo-200', pill: 'bg-indigo-600 text-white' },
                5: { bg: 'bg-amber-500', soft: 'bg-amber-50 text-amber-800 border-amber-200', pill: 'bg-amber-600 text-white' }
            };

            function showToast(message, type = 'info') {
                const container = document.getElementById('toast-container');
                if (!container) return;
                const toast = document.createElement('div');
                const styles = {
                    success: 'bg-emerald-900 text-white border-emerald-700',
                    error: 'bg-rose-900 text-white border-rose-700',
                    info: 'bg-slate-900 text-white border-slate-700'
                };
                toast.className = `pointer-events-auto px-4 py-3 rounded-2xl border shadow-lg text-xs sm:text-sm font-semibold flex items-center justify-between gap-3 transition-all duration-300 ${styles[type] || styles.info}`;
                toast.innerHTML = `<span>${message}</span>`;
                container.appendChild(toast);
                setTimeout(() => {
                    toast.style.opacity = '0';
                    setTimeout(() => toast.remove(), 300);
                }, 3200);
            }

            function handleSyncPillClick() {
                if (GitHubSync.isConfigured()) {
                    GitHubSync.pullFromGitHub(false);
                } else {
                    switchView('settings');
                }
            }

            function switchView(view, params = {}, options = {}) {
                if (currentView === 'match' && view !== 'match') {
                    MatchGame.stopTimer();
                }

                if (view === 'quiz' && options.forceMode) {
                    QuizModule.openSetup(options.forceMode, options.sourceType || 'all', options.sourceValue || '');
                }

                currentView = view;
                viewParams = { lessonFilter: 'ALL', textFilter: '', ...params };

                const snap = createSnapshot(currentView, viewParams);
                const prevSnap = navHistory[navIndex];
                const isSameEntry = prevSnap && JSON.stringify(prevSnap) === JSON.stringify(snap);

                if (options.isInitial) {
                    navHistory = [snap];
                    navIndex = 0;
                    try {
                        window.history.replaceState({ navIndex: 0, snapshot: snap }, '', buildHashFromSnapshot(snap));
                    } catch (e) {}
                } else if (!options.skipHistory && !isSameEntry) {
                    navHistory = navHistory.slice(0, navIndex + 1);
                    navHistory.push(snap);
                    navIndex = navHistory.length - 1;
                    try {
                        window.history.pushState({ navIndex, snapshot: snap }, '', buildHashFromSnapshot(snap));
                    } catch (e) {}
                }

                updateActiveNavigation();
                updateHistoryButtons();
                renderView();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }

            function updateActiveNavigation() {
                document.querySelectorAll('.level-pill').forEach(btn => {
                    const pill = btn.getAttribute('data-pill');
                    btn.className = 'level-pill px-3.5 py-1.5 rounded-full text-xs sm:text-sm font-bold transition whitespace-nowrap flex items-center gap-1 shrink-0 ';
                    if (currentView === 'home' && pill === 'home') {
                        btn.className += 'bg-emerald-700 text-white shadow-sm';
                    } else if (currentView === 'hsk' && pill === `hsk-${viewParams.level}`) {
                        btn.className += `${LEVEL_COLORS[viewParams.level].pill} shadow-sm`;
                    } else if (currentView === 'daily' && pill === 'daily') {
                        btn.className += 'bg-emerald-700 text-white shadow-sm px-4';
                    } else {
                        btn.className += 'bg-white text-slate-600 border border-slate-200/80 hover:border-emerald-300 hover:text-emerald-700';
                        if (pill === 'daily') btn.className += ' px-4';
                    }
                });
                ['note', 'flashcard', 'learn', 'quiz', 'upload', 'settings'].forEach(tool => {
                    const el = document.getElementById(`nav-${tool}`);
                    if (!el) return;
                    const qMode = QuizModule.getState().mode;
                    const isActive = currentView === tool || (tool === 'learn' && currentView === 'quiz' && qMode === 'learn') || (tool === 'quiz' && currentView === 'quiz' && qMode === 'quiz');
                    if (isActive) {
                        el.classList.add('bg-emerald-100', 'text-emerald-800');
                        el.classList.remove('text-slate-600');
                    } else {
                        el.classList.remove('bg-emerald-100', 'text-emerald-800');
                        if (tool !== 'note') el.classList.add('text-slate-600');
                    }
                });

                document.querySelectorAll('.mobile-nav-btn').forEach(btn => {
                    const mKey = btn.getAttribute('data-mnav');
                    const isActive = currentView === mKey || (mKey === 'learn' && currentView === 'quiz');
                    if (isActive) {
                        btn.classList.add('text-emerald-700');
                        btn.classList.remove('text-slate-500');
                    } else {
                        btn.classList.remove('text-emerald-700');
                        btn.classList.add('text-slate-500');
                    }
                });
            }

            function highlightTargetWord(sentence, targetHanzi) {
                if (!sentence || !targetHanzi) return sentence || '';
                const escaped = targetHanzi.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                return sentence.replace(new RegExp(escaped, 'g'), `<strong class="text-rose-600 bg-rose-50 px-1 rounded font-extrabold underline decoration-rose-400">${targetHanzi}</strong>`);
            }

            function sortLessonNames(a, b) {
                return String(a).localeCompare(String(b), 'vi', { numeric: true, sensitivity: 'base' });
            }

            function ensureDailyStructure(data) {
                const today = SRS.getTodayStr();
                if (!data.dailyProgress) {
                    data.dailyProgress = { streak: 0, onlineDates: [today], selectedMonth: today.slice(0, 7), selectedDate: today, dailyFolders: {}, history: {} };
                }
                if (!data.dailyProgress.dailyFolders) data.dailyProgress.dailyFolders = {};
                if (!data.dailyProgress.history) data.dailyProgress.history = {};
                if (!data.dailyProgress.selectedMonth) data.dailyProgress.selectedMonth = today.slice(0, 7);
                if (!data.dailyProgress.selectedDate) data.dailyProgress.selectedDate = today;
                return data.dailyProgress;
            }

            function getFolderStats(folder, allWords) {
                const words = (folder?.wordIds || []).map(id => allWords.find(w => w.id === id)).filter(Boolean);
                const total = words.length;
                const masteredCount = words.filter(w => w.mastered).length;
                const unmasteredCount = total - masteredCount;
                const unmasteredPct = total > 0 ? Math.round((unmasteredCount / total) * 100) : 0;
                const isRedAlert = total > 0 && unmasteredPct > 30;
                return { words, total, masteredCount, unmasteredCount, unmasteredPct, isRedAlert };
            }

            /* -----------------------------------------------------------------
               RENDER CỘT PHẢI: TỪ VỰNG ĐANG HỌC (NOTE)
            ----------------------------------------------------------------- */
            function renderNoteSidebar() {
                const data = Storage.load();
                const starredWords = data.words.filter(w => w.starred);
                const badge = document.getElementById('note-count-badge');
                if (badge) badge.textContent = starredWords.length;
                const navBadge = document.getElementById('nav-note-count');
                if (navBadge) navBadge.textContent = starredWords.length;
                const mobileBadge = document.getElementById('mobile-note-badge');
                if (mobileBadge) mobileBadge.textContent = starredWords.length;

                const container = document.getElementById('note-list-container');
                if (!container) return;

                if (starredWords.length === 0) {
                    container.innerHTML = `

                            <p class="text-[10px] text-slate-400 mt-0.5">Bấm ⭐ để lưu từ vào đây.</p>
                        </div>

                    return;

                container.innerHTML = starredWords.map(w => `
                    <div onmouseenter="UI.setActiveHanzi('${w.hanzi}')" class="group rounded-lg border border-slate-100 bg-slate-50/70 hover:bg-emerald-50/60 hover:border-emerald-200 px-2 py-1.5 transition flex items-center justify-between gap-1">

                            <div class="flex items-baseline gap-1">
                                <span class="font-hanzi text-sm font-bold text-slate-900 group-hover:text-emerald-700 shrink-0">${w.hanzi}</span>
                                <span class="text-[10px] text-slate-500 truncate">${w.meaning || w.pinyin || ''}</span>
                            </div>
                        </div>
                        <div class="flex items-center shrink-0">
                            <button onclick="DictionaryAI.speak('${w.hanzi}')" class="p-1 rounded-full hover:bg-emerald-100 text-emerald-700 transition" title="Phát âm (Q)">
                                <i data-lucide="volume-2" class="w-3 h-3"></i>
                            </button>
                            <button onclick="UI.toggleStar('${w.id}')" class="p-1 rounded-full hover:bg-amber-100 text-amber-500 transition" title="Bỏ sao">
                                <i data-lucide="star" class="w-3 h-3 fill-amber-400"></i>
                            </button>
                        </div>
                    </div>
                `).join('');
                lucide.createIcons();
            }

            function toggleStar(wordId) {
                const data = Storage.load();
                const w = data.words.find(item => item.id === wordId);
                if (!w) return;
                w.starred = !w.starred;
                Storage.save(data);
                renderNoteSidebar();
                renderView();
            }

            function toggleMastered(wordId) {
                const data = Storage.load();
                const w = data.words.find(item => item.id === wordId);
                if (!w) return;
                w.mastered = !w.mastered;
                if (w.mastered && (!w.srs || w.srs.box === 0)) {
                    SRS.recordReview(w, true);
                }
                Storage.save(data);
                updateDailyDueBadge();
                renderView();
            }

            function launchStudyMode(mode, sourceType, sourceValue) {
                if (mode === 'flashcard') {
                    FlashcardModule.initSession(sourceType, sourceValue, false);
                    switchView('flashcard');
                } else if (mode === 'learn') {
                    QuizModule.openSetup('learn', sourceType, sourceValue);
                    switchView('quiz');
                } else if (mode === 'quiz') {
                    QuizModule.openSetup('quiz', sourceType, sourceValue);
                    switchView('quiz');
                } else if (mode === 'match') {
                    if (MatchGame.start(sourceType, sourceValue, 6)) {
                        switchView('match');
                    }
                }
            }

            /* -----------------------------------------------------------------
               RENDER KHU VỰC CHÍNH
            ----------------------------------------------------------------- */
            function renderView() {
                const container = document.getElementById('main-content-area');
                if (!container) return;

                if (currentView === 'home') renderHomeDashboardView(container);
                else if (currentView === 'hsk') renderHskLevelView(container, viewParams.level || 1);
                else if (currentView === 'note') renderNoteMainView(container);
                else if (currentView === 'daily') renderDailyView(container);
                else if (currentView === 'flashcard') renderFlashcardView(container);
                else if (currentView === 'quiz') renderQuizView(container);
                else if (currentView === 'match') renderMatchView(container);
                else if (currentView === 'upload') renderUploadView(container, viewParams.defaultLevel || 1);
                else if (currentView === 'settings') renderSettingsView(container);

                lucide.createIcons();
            }

                        <!-- Hàng 1: 4 thẻ chỉ số tổng quan -->

                                            ${urgentFolders.map(({ folder, stats }) => {

                                                const isDue = folder.nextReviewDate && SRS.isDue(folder.nextReviewDate);
                                                const nextStr = folder.nextReviewDate ? folder.nextReviewDate.split('-').reverse().join('/') : 'Chưa lên lịch';
                                                return `
                                                    <div class="p-3 rounded-2xl border ${stats.isRedAlert ? 'border-rose-400 bg-rose-50/70' : isDue ? 'border-amber-300 bg-amber-50/50' : 'border-emerald-100 bg-emerald-50/30'} flex items-center justify-between gap-2">

            /* VIEW 1: DANH SÁCH TỪ VỰNG HSK 1-5 */
            function renderHskLevelView(container, level) {
                const data = Storage.load();
                const levelWords = data.words.filter(w => w.level === level);
                const sortedUniqueLessons = Array.from(new Set(levelWords.map(w => w.lesson || 'Bài 1'))).sort(sortLessonNames);
                const lessons = ['ALL', ...sortedUniqueLessons];
                const filterText = (viewParams.textFilter || '').toLowerCase();
                const activeLesson = viewParams.lessonFilter || 'ALL';

                const filtered = levelWords.filter(w => {
                    const matchLesson = activeLesson === 'ALL' || (w.lesson || 'Bài 1') === activeLesson;
                    const matchText = !filterText ||
                        w.hanzi.includes(filterText) ||
                        (w.pinyin || '').toLowerCase().includes(filterText) ||
                        (w.meaning || '').toLowerCase().includes(filterText) ||
                        (w.hanViet || '').toLowerCase().includes(filterText);
                    return matchLesson && matchText;
                });

                const grouped = {};
                filtered.forEach(w => {
                    const ls = w.lesson || 'Bài 1';
                    if (!grouped[ls]) grouped[ls] = [];
                    grouped[ls].push(w);
                });
                const sortedGroupEntries = Object.entries(grouped).sort((a, b) => sortLessonNames(a[0], b[0]));

                const c = LEVEL_COLORS[level];
                const modeSourceType = activeLesson === 'ALL' ? 'level' : 'lesson';
                const modeSourceValue = activeLesson === 'ALL' ? `${level}` : `${level}|${activeLesson}`;
                const masteredInLevel = levelWords.filter(w => w.mastered).length;

                container.innerHTML = `

                            </div>
                            ${lessons.length > 1 ? `
                                <div class="flex flex-wrap items-center gap-1.5 w-full">
                                    ${lessons.map(ls => `
                                        <button onclick="UI.setHskFilter('lesson', '${ls.replace(/'/g, "\\'")}')" class="px-3.5 py-1.5 rounded-full text-xs font-bold transition ${activeLesson === ls ? 'bg-slate-800 text-white shadow-2xs' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">
                                            ${ls === 'ALL' ? `Tất cả bài (${sortedUniqueLessons.length})` : ls}
                                        </button>
                                    `).join('')}
                                </div>

                        </div>

                        ${sortedGroupEntries.length === 0 ? `
                            <div class="text-center py-12 bg-slate-50 rounded-2xl border border-dashed border-slate-200 px-4">

                                    <button onclick="UI.openAddWordModal(${level})" class="px-4 py-2.5 rounded-full bg-white border border-slate-200 hover:border-emerald-400 text-slate-700 text-xs font-bold transition">+ Thêm thủ công</button>

                            </div>
                        ` : sortedGroupEntries.map(([lessonName, words]) => {

                                    </div>
                                    <div class="flex items-center gap-1.5">
                                        <button onclick="UI.launchStudyMode('flashcard', 'lesson', '${level}|${safeLessonEsc}')" class="px-2.5 py-1 rounded-full bg-indigo-50 hover:bg-indigo-100 text-indigo-700 text-[11px] font-bold transition">
                                            🗂️ Thẻ bài này
                                        </button>
                                        <button onclick="UI.launchStudyMode('quiz', 'lesson', '${level}|${safeLessonEsc}')" class="px-2.5 py-1 rounded-full bg-emerald-50 hover:bg-emerald-100 text-emerald-700 text-[11px] font-bold transition">
                                            📝 Kiểm tra
                                        </button>
                                        <button type="button" data-confirm-lesson="${lessonKey}" onclick="UI.deleteLessonWords(${level}, '${safeLessonEsc}')" class="px-2.5 py-1 rounded-full bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 text-[11px] font-bold flex items-center gap-1 transition" title="Xóa toàn bộ từ trong bài này">
                                            <i data-lucide="trash-2" class="w-3 h-3"></i>
                                            <span>Xóa</span>

                                    </div>

                                            <div onclick="UI.openWordModal('${w.id}')" class="cursor-pointer flex-1 min-w-0">
                                                <div class="flex items-baseline gap-2 flex-wrap">
                                                    <span class="font-hanzi text-2xl font-bold text-slate-900 group-hover:text-emerald-700 transition">${w.hanzi}</span>
                                                    <span class="text-xs font-semibold text-emerald-700">${w.pinyin || ''}</span>
                                                    ${w.pos ? `<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-slate-100 text-slate-600">${w.pos}</span>` : ''}
                                                </div>
                                                <p class="text-xs text-slate-600 mt-1.5 line-clamp-1">
                                                    ${w.hanViet ? `<span class="uppercase font-bold text-rose-600 text-[11px]">${w.hanViet}</span> • ` : ''}

                                            </div>

                                                    </button>
                                                </div>
                                                <button onclick="UI.toggleMastered('${w.id}')" class="px-2.5 py-1 rounded-full text-[11px] font-bold transition ${w.mastered ? 'bg-emerald-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-emerald-100 hover:text-emerald-700'}">
                                                    ${w.mastered ? '✓ Đã thuộc' : 'Đánh dấu thuộc'}

                                            </div>
                                        </div>

                            </div>

            let pendingDeleteLesson = '';
            function deleteLessonWords(level, lessonName) {
                const key = `${level}-${lessonName}`;
                const btn = document.querySelector(`[data-confirm-lesson="${key}"]`);
                if (pendingDeleteLesson !== key) {
                    pendingDeleteLesson = key;
                    if (btn) btn.innerHTML = `<span>Bấm lần nữa để xóa!</span>`;
                    setTimeout(() => {
                        if (pendingDeleteLesson === key) {
                            pendingDeleteLesson = '';
                            renderView();
                        }
                    }, 3000);
                    return;
                }
                pendingDeleteLesson = '';
                const data = Storage.load();
                data.words = data.words.filter(w => !(w.level === level && (w.lesson || 'Bài 1') === lessonName));
                Storage.save(data, true);
                renderNoteSidebar();
                updateDailyDueBadge();
                renderView();
                showToast(`Đã xóa toàn bộ từ trong ${lessonName} (HSK ${level}).`, 'info');
            }

            let pendingDeleteAllLevel = 0;
            function deleteAllWordsInLevel(level) {
                const btn = document.getElementById(`btn-delete-all-hsk-${level}`);
                if (pendingDeleteAllLevel !== level) {
                    pendingDeleteAllLevel = level;
                    if (btn) btn.innerHTML = `<span>⚠️ Bấm lần nữa để xóa sạch HSK ${level}!</span>`;
                    setTimeout(() => {
                        if (pendingDeleteAllLevel === level) {
                            pendingDeleteAllLevel = 0;
                            renderView();
                        }
                    }, 3500);
                    return;
                }
                pendingDeleteAllLevel = 0;
                const data = Storage.load();
                const removedIds = new Set(data.words.filter(w => w.level === level).map(w => w.id));
                data.words = data.words.filter(w => w.level !== level);
                if (data.dailyProgress?.dailyFolders) {
                    Object.values(data.dailyProgress.dailyFolders).forEach(f => {
                        if (Array.isArray(f.wordIds)) {
                            f.wordIds = f.wordIds.filter(id => !removedIds.has(id));
                        }
                    });
                }
                viewParams.lessonFilter = 'ALL';
                Storage.save(data, true);
                renderNoteSidebar();
                updateDailyDueBadge();
                renderView();
                showToast(`🗑️ Đã xóa toàn bộ tất cả các bài trong HSK ${level} & đồng bộ GitHub!`, 'info');
            }

            function setHskFilter(type, val) {
                if (type === 'text') viewParams.textFilter = val;
                if (type === 'lesson') viewParams.lessonFilter = val;
                renderView();
            }

                                </div>

                            <button onclick="UI.launchStudyMode('flashcard', 'starred', '')" class="p-2.5 sm:p-3 rounded-2xl bg-indigo-50/70 hover:bg-indigo-100/80 border border-indigo-200/80 flex items-center justify-center gap-1.5 text-xs sm:text-sm font-extrabold text-indigo-900 transition">

                                <span>Thẻ nhớ</span>
                            </button>
                            <button onclick="UI.launchStudyMode('learn', 'starred', '')" class="p-2.5 sm:p-3 rounded-2xl bg-sky-50/70 hover:bg-sky-100/80 border border-sky-200/80 flex items-center justify-center gap-1.5 text-xs sm:text-sm font-extrabold text-sky-900 transition">
                                <i data-lucide="brain-circuit" class="w-4 h-4 text-sky-600 shrink-0"></i>
                                <span>Học</span>
                            </button>
                            <button onclick="UI.launchStudyMode('quiz', 'starred', '')" class="p-2.5 sm:p-3 rounded-2xl bg-emerald-50/70 hover:bg-emerald-100/80 border border-emerald-200/80 flex items-center justify-center gap-1.5 text-xs sm:text-sm font-extrabold text-emerald-900 transition">
                                <i data-lucide="file-check-2" class="w-4 h-4 text-emerald-600 shrink-0"></i>
                                <span>Kiểm tra</span>

                        </div>

                        ${starredWords.length === 0 ? `

                                <p class="text-xs text-slate-400 mt-1">Bấm nút ⭐ ở bất kỳ từ nào hoặc vuốt trái Flashcard để thêm vào đây.</p>
                            </div>
                        ` : `
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                ${starredWords.map(w => `
                                    <div onmouseenter="UI.setActiveHanzi('${w.hanzi}')" class="group rounded-2xl border border-amber-200/80 bg-amber-50/20 p-3.5 sm:p-4 hover:shadow-md hover:border-amber-400 transition flex items-start justify-between gap-2">
                                        <div onclick="UI.openWordModal('${w.id}')" class="cursor-pointer flex-1 min-w-0">

                                                <span class="font-hanzi text-2xl font-bold text-slate-900 group-hover:text-emerald-700 transition">${w.hanzi}</span>

                                                <span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${LEVEL_COLORS[w.level]?.soft || 'bg-slate-100'}">HSK ${w.level}</span>

            function selectDailyMonth(ym) {
                if (!ym) return;
                const data = Storage.load();
                const dp = ensureDailyStructure(data);
                dp.selectedMonth = ym;
                const existingInMonth = Object.keys(dp.dailyFolders || {}).filter(d => d.startsWith(ym)).sort();
                if (existingInMonth.length > 0) {
                    dp.selectedDate = existingInMonth[existingInMonth.length - 1];
                }
                Storage.saveLocalOnly(data);
                renderView();
            }

            function selectDailyDate(dateStr) {
                const data = Storage.load();
                const dp = ensureDailyStructure(data);
                dp.selectedDate = dateStr;
                dp.selectedMonth = dateStr.slice(0, 7);
                Storage.saveLocalOnly(data);
                renderView();
            }

            function createNewDayFolderPrompt(ym) {
                const data = Storage.load();
                const dp = ensureDailyStructure(data);
                const today = SRS.getTodayStr();
                const existingInMonth = Object.keys(dp.dailyFolders || {}).filter(d => d.startsWith(ym)).sort();
                let newDate = today.startsWith(ym) ? today : `${ym}-01`;

                if (dp.dailyFolders[newDate] && existingInMonth.length > 0) {
                    const lastDay = parseInt(existingInMonth[existingInMonth.length - 1].split('-')[2], 10) || 1;
                    const nextDayNum = Math.min(lastDay + 1, 31);
                    newDate = `${ym}-${String(nextDayNum).padStart(2, '0')}`;
                }

                if (!dp.dailyFolders[newDate]) {
                    dp.dailyFolders[newDate] = { date: newDate, wordIds: [], lastStudied: null, nextReviewDate: null, box: 0 };
                }
                dp.selectedDate = newDate;
                Storage.save(data);
                renderView();
                showToast(`Đã tạo thư mục Ngày ${newDate.split('-').reverse().join('/')}!`, 'success');
            }

            async function importFileToDailyFolder(event, dateStr) {
                const inputEl = event.target;
                const file = inputEl?.files?.[0];
                if (!file) return;
                try {
                    const text = await Parser.extractTextFromFile(file);
                    await addQuickWordToDailyFolder(dateStr, text);
                } catch (err) {
                    showToast(err.message, 'error');
                } finally {
                    if (inputEl) inputEl.value = '';
                }
            }

            let pendingDeleteDay = '';
            function deleteDailyFolder(dateStr) {
                const btn = document.querySelector(`[data-confirm-day="${dateStr}"]`);
                if (pendingDeleteDay !== dateStr) {
                    pendingDeleteDay = dateStr;
                    if (btn) btn.innerHTML = `<span>Bấm lần nữa để xóa!</span>`;
                    setTimeout(() => {
                        if (pendingDeleteDay === dateStr) {
                            pendingDeleteDay = '';
                            renderView();
                        }
                    }, 3000);
                    return;
                }
                pendingDeleteDay = '';
                const data = Storage.load();
                const dp = ensureDailyStructure(data);
                delete dp.dailyFolders[dateStr];
                if (dp.history) delete dp.history[dateStr];

                const ym = dateStr.slice(0, 7);
                const remainingInMonth = Object.keys(dp.dailyFolders).filter(d => d.startsWith(ym)).sort();
                if (remainingInMonth.length > 0) {
                    dp.selectedDate = remainingInMonth[remainingInMonth.length - 1];
                } else {
                    const allLeft = Object.keys(dp.dailyFolders).sort();
                    if (allLeft.length > 0) {
                        dp.selectedDate = allLeft[allLeft.length - 1];
                        dp.selectedMonth = dp.selectedDate.slice(0, 7);
                    }
                }
                Storage.save(data);
                updateDailyDueBadge();
                renderView();
                showToast(`Đã xóa thư mục Ngày ${dateStr.split('-').reverse().join('/')}!`, 'info');
            }

            function groupDailyFoldersByMonth(data) {
                const folders = data.dailyProgress?.dailyFolders || {};
                const grouped = {};
                Object.keys(folders).forEach(dateStr => {
                    const ym = dateStr.slice(0, 7);
                    if (!grouped[ym]) grouped[ym] = [];
                    grouped[ym].push({
                        date: dateStr,
                        dayNum: dateStr.split('-')[2],
                        count: (folders[dateStr]?.wordIds || []).length
                    });
                });
                return Object.entries(grouped)
                    .sort((a, b) => b[0].localeCompare(a[0]))
                    .map(([ym, days]) => {
                        const [y, m] = ym.split('-');
                        return {
                            ym,
                            label: `Tháng ${m}/${y}`,
                            days: days.sort((a, b) => a.date.localeCompare(b.date))
                        };
                    });
            }

            async function addQuickWordToDailyFolder(dateStr, rawOverride = null) {
                const input = document.getElementById('daily-quick-add-input');
                const rawText = rawOverride !== null ? rawOverride : (input?.value || '').trim();
                if (!rawText) {
                    showToast("Vui lòng nhập hoặc dán danh sách từ vựng!", "error");
                    return;
                }

                const parsedList = Parser.parseRawText(rawText, 5);
                if (parsedList.length === 0) {
                    showToast("Không tìm thấy chữ Hán hợp lệ trong nội dung đã nhập.", "error");
                    return;
                }

                const data = Storage.load();
                const dp = ensureDailyStructure(data);
                if (!dp.dailyFolders[dateStr]) {
                    dp.dailyFolders[dateStr] = { date: dateStr, wordIds: [], lastStudied: null, nextReviewDate: null, box: 0 };
                }

                const today = SRS.getTodayStr();
                parsedList.forEach((parsed, idx) => {
                    const preset = DictionaryAI.BUILTIN_DICT[parsed.hanzi];
                    const cleanTargetHz = (parsed.hanzi || '').trim();
                    const repoWords = data.words.filter(w => !w.isDailyOnly);
                    const matchedInRepo = repoWords.find(w => (w.hanzi || '').trim() === cleanTargetHz && (w.hasCustomMeasure || w.hasCustomHanzi || w.isCustomExample || (w.measureCards && w.measureCards.length > 0)))
                        || repoWords.find(w => (w.hanzi || '').trim() === cleanTargetHz)
                        || data.words.find(w => (w.hanzi || '').trim() === cleanTargetHz && (w.hasCustomMeasure || w.hasCustomHanzi || w.isCustomExample))
                        || data.words.find(w => (w.hanzi || '').trim() === cleanTargetHz);

                    const hasExplicitHeader = /^(?:hsk\s*[1-5]|bài\s*\d+)/im.test(rawText);
                    const detectedLevel = hasExplicitHeader
                        ? (parsed.level || matchedInRepo?.level || preset?.level || 5)
                        : (matchedInRepo?.level || preset?.level || parsed.level || 5);
                    const rawLesson = hasExplicitHeader
                        ? (parsed.lesson || matchedInRepo?.lesson || 'Bài 1')
                        : (matchedInRepo?.lesson || parsed.lesson || 'Bài 1');
                    const detectedLesson = String(rawLesson).replace(/^hsk\s*[1-5]\s*[-–—:|]?\s*/i, '').trim() || 'Bài 1';

                    const useParsedMeasure = parsed.hasCustomMeasure && Array.isArray(parsed.measureCards) && parsed.measureCards.length > 0;
                    const useRepoMeasure = Array.isArray(matchedInRepo?.measureCards) && matchedInRepo.measureCards.length > 0;
                    const finalMeasureCards = useParsedMeasure ? parsed.measureCards : (useRepoMeasure ? matchedInRepo.measureCards : (parsed.measureCards || []));
                    const finalMeasureStr = useParsedMeasure ? parsed.measure : (useRepoMeasure ? matchedInRepo.measure : (parsed.measure || ''));

                    const wordObj = {
                        id: 'w_' + Date.now() + '_' + idx + '_' + Math.random().toString(36).slice(2, 6),
                        ...parsed,
                        level: detectedLevel,
                        lesson: detectedLesson,
                        pos: normalizePosToEnglish(parsed.pos || matchedInRepo?.pos || ''),
                        hanViet: parsed.hanViet || matchedInRepo?.hanViet || '',
                        meaning: parsed.meaning || matchedInRepo?.meaning || '',
                        measure: finalMeasureStr,
                        measureCards: finalMeasureCards,
                        hasCustomMeasure: Boolean(parsed.hasCustomMeasure || matchedInRepo?.hasCustomMeasure),
                        radicals: (parsed.hasCustomHanzi ? parsed.radicals : (matchedInRepo?.radicals?.length ? matchedInRepo.radicals : parsed.radicals)) || [],
                        hasCustomHanzi: Boolean(parsed.hasCustomHanzi || matchedInRepo?.hasCustomHanzi),
                        example: (parsed.isCustomExample ? parsed.example : (matchedInRepo?.isCustomExample ? matchedInRepo.example : (matchedInRepo?.example?.cn ? matchedInRepo.example : parsed.example))),
                        isCustomExample: Boolean(parsed.isCustomExample || matchedInRepo?.isCustomExample),
                        isDailyOnly: true,
                        starred: false,
                        mastered: matchedInRepo?.mastered || false,
                        srs: { box: 0, firstLearned: null, lastReviewed: null, nextDue: today, correct: 0, wrong: 0 }
                    };
                    data.words.unshift(wordObj);
                    dp.dailyFolders[dateStr].wordIds.push(wordObj.id);
                });

                dp.history[dateStr] = [...dp.dailyFolders[dateStr].wordIds];
                Storage.save(data, true);
                if (input && rawOverride === null) input.value = '';
                updateDailyDueBadge();
                renderView();
                showToast(`Đã thêm ${parsedList.length} từ vào thư mục ngày ${dateStr.split('-').reverse().join('/')}!`, 'success');
            }

            function removeWordFromDailyFolder(dateStr, wordId) {
                const data = Storage.load();
                const folder = data.dailyProgress.dailyFolders?.[dateStr];
                if (!folder) return;
                folder.wordIds = folder.wordIds.filter(id => id !== wordId);
                data.dailyProgress.history[dateStr] = [...folder.wordIds];
                Storage.save(data);
                updateDailyDueBadge();

            }

            function autoFillDailyFolder(dateStr) {
                const data = Storage.load();
                if (data.words.length === 0) {
                    showToast("Kho HSK 1–5 đang trống. Hãy upload file tài liệu vào kho trước nhé!", "info");
                    return;
                }
                const dp = ensureDailyStructure(data);
                const newQuota = data.settings.dailyNewHsk5 || 22;
                const revPerLvl = data.settings.dailyReviewPerLevel || 5;

                const hsk5New = data.words.filter(w => w.level === 5 && !w.mastered).slice(0, newQuota).map(w => w.id);
                const reviewIds = [];
                [1, 2, 3, 4].forEach(lvl => {
                    data.words
                        .filter(w => w.level === lvl)
                        .sort((a, b) => (SRS.isDue(a.srs?.nextDue) ? 0 : 1) - (SRS.isDue(b.srs?.nextDue) ? 0 : 1))
                        .slice(0, revPerLvl)
                        .forEach(w => reviewIds.push(w.id));
                });

                const folder = dp.dailyFolders[dateStr] || { date: dateStr, wordIds: [], lastStudied: null, nextReviewDate: null, box: 0 };
                folder.wordIds = Array.from(new Set([...folder.wordIds, ...hsk5New, ...reviewIds]));
                dp.dailyFolders[dateStr] = folder;
                dp.history[dateStr] = [...folder.wordIds];
                Storage.save(data);
                updateDailyDueBadge();
                renderView();
                showToast(`Đã nạp ${folder.wordIds.length} từ vào thư mục ngày ${dateStr.split('-').reverse().join('/')}`, 'success');
            }

            function completeDailyFolderStudy(dateStr) {
                const data = Storage.load();
                const dp = ensureDailyStructure(data);
                const today = SRS.getTodayStr();
                const folder = dp.dailyFolders[dateStr];
                if (!folder) return;

                const intervals = [2, 4, 7, 15, 30];
                const nextBox = Math.min((folder.box || 0) + 1, intervals.length);
                const addDays = intervals[nextBox - 1] || 2;

                folder.lastStudied = today;
                folder.box = nextBox;
                folder.nextReviewDate = SRS.addDaysStr(today, addDays);

                if (dp.lastCompletedDate !== today) {
                    const yesterday = SRS.addDaysStr(today, -1);
                    dp.streak = dp.lastCompletedDate === yesterday ? (dp.streak || 0) + 1 : 1;
                    dp.lastCompletedDate = today;
                }

                Storage.save(data);
                updateDailyDueBadge();
                renderView();
                const [ny, nm, nd] = folder.nextReviewDate.split('-');
                const [fy, fm, fd] = dateStr.split('-');
                showToast(`📅 Đã ghi nhận học Ngày ${fd} (${fm}/${fy})! Hệ thống sẽ nhắc ôn lại vào ngày ${nd}/${nm}/${ny}.`, 'success');
            }

                lastMatchConfig = { type, id: id || '', pairs };
                if (MatchGame.start(type, id || '', pairs)) renderView();

            function startMatchFromLast() {
                if (MatchGame.start(lastMatchConfig.type, lastMatchConfig.id, lastMatchConfig.pairs)) renderView();

                const initLvl = parseInt(defaultLevel, 10) || 1;
                container.innerHTML = `
                    <div class="bg-white rounded-3xl border border-emerald-100 shadow-sm p-4 sm:p-8 space-y-5 sm:space-y-6">

                                    <p class="text-xs text-slate-500 mt-0.5">Lưu kèm ngày upload để nhắc ôn ngắt quãng.</p>
                                </div>
                            </label>
                        </div>

                        <div class="p-3.5 rounded-2xl bg-slate-50 border border-slate-200 flex flex-wrap items-center justify-between gap-2">

            function toggleDeckNameBox(show) {
                const box = document.getElementById('deck-name-box');
                if (box) box.classList.toggle('hidden', !show);
            }

            function detectLevelFromFilename(filename) {
                const m = String(filename || '').match(/hsk\s*([1-5])/i);
                return m ? parseInt(m[1], 10) : null;
            }

            async function handleFileSelected(event) {
                const inputEl = event.target;
                const file = inputEl?.files?.[0];
                if (!file) return;
                try {
                    const text = await Parser.extractTextFromFile(file);
                    const deckInput = document.getElementById('upload-deck-name');
                    if (deckInput && !deckInput.value) {
                        deckInput.value = file.name.replace(/\.[^/.]+$/, '');
                    }
                    const selLvl = parseInt(document.getElementById('upload-default-level')?.value, 10) || 1;
                    const fileNameLvl = detectLevelFromFilename(file.name);
                    const fallbackLvl = fileNameLvl || selLvl;

                    pendingUploadWords = Parser.parseRawText(text, fallbackLvl);
                    renderUploadPreview();
                    if (pendingUploadWords.length > 0) {
                        showToast(`Đã đọc ${pendingUploadWords.length} từ từ file "${file.name}"`, 'success');
                    } else {
                        showToast(`Không tìm thấy chữ Hán hợp lệ trong file "${file.name}".`, 'error');
                    }
                } catch (err) {
                    showToast(err.message, 'error');
                } finally {
                    if (inputEl) inputEl.value = '';
                }
            }

            function parsePastedText() {
                const raw = document.getElementById('raw-paste-input')?.value || '';
                if (!raw.trim()) {
                    showToast("Vui lòng nhập hoặc dán nội dung từ vựng trước.", "error");
                    return;
                }
                const selLvl = parseInt(document.getElementById('upload-default-level')?.value, 10) || 1;
                pendingUploadWords = Parser.parseRawText(raw, selLvl);
                renderUploadPreview();
            }

            function renderUploadPreview() {
                const area = document.getElementById('upload-preview-area');
                if (!area) return;
                if (pendingUploadWords.length === 0) {
                    area.innerHTML = `<p class="text-xs text-rose-600 font-semibold">Không tìm thấy chữ Hán hợp lệ trong nội dung.</p>`;
                    return;
                }

                area.innerHTML = `
                    <div class="border-t border-slate-100 pt-5">
                        <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
                            <h3 class="text-sm font-extrabold text-slate-800">Xem trước (${pendingUploadWords.length} từ) — Giữ nguyên toàn bộ từ trong file</h3>
                            <button id="btn-confirm-save-upload" type="button" onclick="UI.confirmSaveUploadedWords()" class="px-5 py-2.5 rounded-full bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-extrabold shadow-md transition">

            function updatePendingWord(idx, field, val) {
                if (pendingUploadWords[idx]) pendingUploadWords[idx][field] = val;
            }

            function confirmSaveUploadedWords() {
                if (pendingUploadWords.length === 0) {
                    showToast("Chưa có dữ liệu từ vựng để lưu!", "error");
                    return;
                }
                const saveBtn = document.getElementById('btn-confirm-save-upload');
                if (saveBtn) {
                    saveBtn.disabled = true;
                    saveBtn.innerHTML = `<span>⏳ Đang lưu ${pendingUploadWords.length} từ...</span>`;
                }

                setTimeout(() => {
                    try {
                        const data = Storage.load();
                        const mode = document.querySelector('input[name="upload-mode"]:checked')?.value || 'hsk_db';
                        const today = SRS.getTodayStr();
                        let addedCount = 0;
                        const deckWordIds = [];
                        const levelCounts = {};
                        const baseTs = Date.now();
                        const uploadedByHanzi = {};

                        pendingUploadWords.forEach((item, idx) => {
                            const lvlNum = parseInt(item.level, 10) || 1;
                            levelCounts[lvlNum] = (levelCounts[lvlNum] || 0) + 1;
                            const newWord = {
                                id: `w_${baseTs}_${idx}`,
                                hanzi: item.hanzi,
                                pinyin: item.pinyin || '',
                                level: lvlNum,
                                lesson: item.lesson || 'Bài 1',
                                pos: normalizePosToEnglish(item.pos || ''),
                                hanViet: item.hanViet || '',
                                meaning: item.meaning || '',
                                starred: false,
                                mastered: false
                            };
                            if (Array.isArray(item.measureCards) && item.measureCards.length > 0) {
                                newWord.measureCards = item.measureCards;
                                newWord.measure = item.measure || '';
                            }
                            if (item.hasCustomMeasure) {
                                newWord.hasCustomMeasure = true;
                            }
                            if (item.hasCustomHanzi && Array.isArray(item.radicals) && item.radicals.length > 0) {
                                newWord.radicals = item.radicals;
                                newWord.hasCustomHanzi = true;
                            }
                            if (item.isCustomExample && item.example?.cn) {
                                newWord.example = item.example;
                                newWord.isCustomExample = true;
                            }
                            data.words.push(newWord);
                            uploadedByHanzi[newWord.hanzi] = newWord;
                            addedCount++;
                            deckWordIds.push(newWord.id);
                        });

                        // Liên kết ngược sang các từ đã có ở mục Học theo ngày để kế thừa lượng từ, câu ví dụ & Hán tự
                        data.words.forEach(existing => {
                            if (existing.isDailyOnly && uploadedByHanzi[existing.hanzi]) {
                                const src = uploadedByHanzi[existing.hanzi];
                                existing.level = src.level;
                                existing.lesson = src.lesson;
                                if (src.pos) existing.pos = src.pos;
                                if (src.hanViet) existing.hanViet = src.hanViet;
                                if (src.meaning) existing.meaning = src.meaning;
                                if (src.hasCustomMeasure || src.measureCards?.length) {
                                    existing.measureCards = src.measureCards || [];
                                    existing.measure = src.measure || '';
                                    if (src.hasCustomMeasure) existing.hasCustomMeasure = true;
                                }
                                if (src.hasCustomHanzi && src.radicals?.length) {
                                    existing.radicals = src.radicals;
                                    existing.hasCustomHanzi = true;
                                }
                                if (src.isCustomExample && src.example?.cn) {
                                    existing.example = src.example;
                                    existing.isCustomExample = true;
                                }
                            }
                        });

                        const targetLevel = parseInt(
                            Object.entries(levelCounts).sort((a, b) => b[1] - a[1])[0]?.[0] || '5',
                            10
                        );

                        if (mode === 'flashcard_deck') {
                            const deckName = (document.getElementById('upload-deck-name')?.value || '').trim() || `Bộ thẻ ngày ${today}`;
                            data.decks.unshift({
                                id: 'deck_' + baseTs,
                                name: deckName,
                                uploadDate: today,
                                lastReviewed: today,
                                box: 1,
                                nextDue: SRS.addDaysStr(today, 1),
                                wordIds: deckWordIds
                            });
                        }

                        Storage.save(data, true);
                        pendingUploadWords = [];
                        updateDailyDueBadge();
                        showToast(`✅ Đã lưu đầy đủ ${addedCount} từ vào HSK ${targetLevel} & đang đồng bộ GitHub!`, 'success');
                        switchView(mode === 'flashcard_deck' ? 'flashcard' : 'hsk', { level: targetLevel });
                    } catch (err) {
                        showToast(`Lỗi khi lưu từ vựng: ${err.message}`, 'error');
                        if (saveBtn) {
                            saveBtn.disabled = false;
                            saveBtn.innerHTML = `✓ Lưu vào hệ thống & Đồng bộ`;
                        }
                    }
                }, 30);
            }

            async function importJsonBackup(event) {
                const file = event.target.files?.[0];
                if (!file) return;
                try {
                    const text = await file.text();
                    const parsed = JSON.parse(text);
                    if (!Array.isArray(parsed.words)) throw new Error("File JSON không đúng định dạng STUDY HSK.");
                    Storage.save(parsed, true);
                    renderNoteSidebar();
                    updateDailyDueBadge();
                    renderView();
                    showToast("Đã khôi phục dữ liệu từ file JSON!", "success");
                } catch (e) {

            async function openWordModal(wordId, skipAutoEnrich = false, keepCharIdx = false) {
                const data = Storage.load();
                const w = data.words.find(item => item.id === wordId);
                if (!w) return;

                const data = Storage.load();

                if (!w) return;

                w.pinyin = document.getElementById('edit-pinyin').value.trim();
                w.pos = normalizePosToEnglish(document.getElementById('edit-pos').value.trim());
                w.hanViet = document.getElementById('edit-hanviet').value.trim();
                w.meaning = document.getElementById('edit-meaning').value.trim();
