            color: #1e293b;
            -webkit-tap-highlight-color: transparent;
            padding-top: env(safe-area-inset-top);

        }
        @media (min-width: 1024px) {
            body {
                padding-bottom: 1.5rem;
            }
        }
        .font-hanzi {
            font-family: 'Noto Sans SC', 'Noto Serif SC', sans-serif;
        }
        .font-hanzi-serif {
            font-family: 'Noto Serif SC', 'Noto Sans SC', serif;
        }

        /* Ngăn Safari trên iPhone 13 tự động zoom màn hình khi focus vào input/textarea */
        @media screen and (max-width: 768px) {
            input[type="text"],
            input[type="password"],
            input[type="number"],
            input[type="time"],
            input[type="month"],
            textarea,
            select {
                font-size: 16px !important;
            }
        }

        /* Ẩn thanh cuộn ngang nhưng vẫn vuốt mượt trên iPhone */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Hiệu ứng lật thẻ 3D cho Flashcard */
        .perspective-1000 {
            perspective: 1000px;
        }
        .preserve-3d {
            transform-style: preserve-3d;
            transition: transform 0.55s cubic-bezier(0.23, 1, 0.32, 1);
        }
        .rotate-y-180 {
            transform: rotateY(180deg);
        }
        .backface-hidden {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }

        /* Thanh cuộn tinh tế cho Desktop */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* Hiệu ứng rung khi nối sai trong Match Game */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }
        .animate-shake {
            animation: shake 0.35s ease-in-out;
        }

        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom);
        }
    </style>

    <script>
        /* =====================================================================
           MODULE 1: SRS (Spaced Repetition System — 1 -> 2 -> 4 -> 7 -> 15 -> 30 ngày)
        ====================================================================== */
        const SRS = (() => {
            const INTERVALS = [1, 2, 4, 7, 15, 30];

            function getTodayStr() {
                const d = new Date();
                const y = d.getFullYear();
                const m = String(d.getMonth() + 1).padStart(2, '0');
                const day = String(d.getDate()).padStart(2, '0');

            function getHanziHash(str) {
                let h = 0;
                for (let i = 0; i < str.length; i++) {
                    h = (h * 31 + str.charCodeAt(i)) >>> 0;
                }
                return h;
            }

            function buildNaturalDailyExample(hanzi, py, pos, meaning) {
                if (DAILY_EXAMPLES[hanzi]) return DAILY_EXAMPLES[hanzi];

                const posLower = (pos || '').toLowerCase();
                const shortMeaning = (meaning || hanzi).split(/[;,]/)[0].trim();
                const cleanPy = (py || hanzi).trim();
                const hash = getHanziHash(hanzi);

                const applyTpl = (tpl) => ({
                    cn: tpl.cn.replace(/\{w\}/g, hanzi),
                    py: tpl.py.replace(/\{py\}/g, cleanPy),
                    vi: tpl.vi.replace(/\{m\}/g, shortMeaning)
                });

                if (!/\b(đgt|v|tt|adj|phó|adv|liên|conj)\b/.test(posLower)) {
                    const topic = CONTEXTUAL_NOUN_TEMPLATES.find(t => t.regex.test(hanzi));
                    if (topic) {
                        const chosen = topic.sentences[hash % topic.sentences.length];
                        return applyTpl(chosen);
                    }
                }

                let pool = GENERAL_TEMPLATES_BY_POS.noun;
                if (posLower.includes('đgt') || posLower.includes('v')) pool = GENERAL_TEMPLATES_BY_POS.verb;
                else if (posLower.includes('tt') || posLower.includes('adj')) pool = GENERAL_TEMPLATES_BY_POS.adj;
                else if (posLower.includes('phó') || posLower.includes('adv')) pool = GENERAL_TEMPLATES_BY_POS.adv;
                else if (posLower.includes('liên') || posLower.includes('conj')) pool = GENERAL_TEMPLATES_BY_POS.conj;

                return applyTpl(pool[hash % pool.length]);
            }

            let preferredVoice = null;
            function loadChineseVoice() {
                if (!('speechSynthesis' in window)) return;
                const voices = window.speechSynthesis.getVoices();
                if (!voices || voices.length === 0) return;

                preferredVoice =
                    voices.find(v => v.name.includes('Google 普通话（中国大陆）')) ||
                    voices.find(v => v.name.includes('Microsoft Xiaoxiao') || v.name.includes('Microsoft Yunxi')) ||
                    voices.find(v => v.lang === 'zh-CN' || v.lang === 'cmn-Hans-CN') ||
                    voices.find(v => v.lang && v.lang.toLowerCase().startsWith('zh'));
            }

            if ('speechSynthesis' in window) {
                loadChineseVoice();
                window.speechSynthesis.onvoiceschanged = loadChineseVoice;
            }

            function speak(text, customRate = null) {
                if (!text) return;
                if (!('speechSynthesis' in window)) {
                    UI.showToast("Trình duyệt không hỗ trợ phát âm tiếng Trung.", "error");
                    return;
                }
                window.speechSynthesis.cancel();
                const data = Storage.load();
                const rate = customRate || data.settings?.speechRate || 1.0;

                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'zh-CN';
                utterance.rate = rate;
                utterance.pitch = 1.0;
                if (!preferredVoice) loadChineseVoice();
                if (preferredVoice) utterance.voice = preferredVoice;

                window.speechSynthesis.speak(utterance);
            }

            function playFeedbackSound(isCorrect) {
                try {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (!AudioCtx) return;
                    const ctx = new AudioCtx();
                    const now = ctx.currentTime;

                    if (isCorrect) {
                        [523.25, 659.25, 783.99].forEach((freq, idx) => {
                            const osc = ctx.createOscillator();
                            const gain = ctx.createGain();
                            osc.type = 'sine';
                            osc.frequency.setValueAtTime(freq, now + idx * 0.065);
                            gain.gain.setValueAtTime(0.14, now + idx * 0.065);
                            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.065 + 0.25);
                            osc.connect(gain);
                            gain.connect(ctx.destination);
                            osc.start(now + idx * 0.065);
                            osc.stop(now + idx * 0.065 + 0.26);
                        });
                    } else {
                        [240, 185].forEach((freq, idx) => {
                            const osc = ctx.createOscillator();
                            const gain = ctx.createGain();
                            osc.type = 'triangle';
                            osc.frequency.setValueAtTime(freq, now + idx * 0.11);
                            gain.gain.setValueAtTime(0.16, now + idx * 0.11);
                            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.11 + 0.28);
                            osc.connect(gain);
                            gain.connect(ctx.destination);
                            osc.start(now + idx * 0.11);
                            osc.stop(now + idx * 0.11 + 0.29);
                        });
                    }
                } catch (e) {}
            }

            function buildSmartFallbackEnrich(hanzi, existingPy = '', existingPos = '', existingMeaning = '') {
                const preset = BUILTIN_DICT[hanzi];
                const py = existingPy || generatePinyin(hanzi);
                const chars = Array.from(hanzi).filter(c => /[\u4e00-\u9fa5]/.test(c));

                const enrichCharEntry = (ch, baseItem = {}) => {
                    const detail = HANZI_CHAR_DETAILS[ch];
                    if (detail) {
                        return { char: ch, ...detail, ...baseItem, components: baseItem.components || detail.components };
                    }
                    const chPy = baseItem.pinyin || generatePinyin(ch);
                    const radLabel = baseItem.radical || `Chữ ${ch}`;
                    const radMean = baseItem.meaning || `Chữ "${ch}" (${chPy}) — bấm nút "Tạo thông tin tự động (AI)" để phân tích chi tiết thêm.`;

                    let extractedComps = Array.isArray(baseItem.components) ? baseItem.components : [];
                    if (extractedComps.length === 0) {
                        const radMatch = radLabel.match(/([\u4e00-\u9fa5\u2e80-\u2eff])\s*\(([^)]+)\)/);
                        if (radMatch) {
                            const rChar = radMatch[1];
                            const rHv = radMatch[2].toUpperCase();
                            extractedComps = [{ char: rChar, pinyin: generatePinyin(rChar) || chPy, hanViet: rHv }];
                        } else {
                            extractedComps = [{ char: ch, pinyin: chPy, hanViet: 'HÁN TỰ' }];
                        }
                    }

                    return {
                        char: ch,
                        pinyin: chPy,
                        structure: baseItem.structure || 'Kết cấu hợp thể',
                        liushu: baseItem.liushu || 'hình thanh & hội ý',
                        radical: radLabel,
                        strokes: baseItem.strokes || '—',
                        strokeOrder: baseItem.strokeOrder || '',
                        components: extractedComps,
                        meaning: radMean
                    };
                };

                if (preset) {
                    const enrichedRadicals = chars.map((ch, i) => enrichCharEntry(ch, preset.radicals?.[i] || {}));
                    return {
                        pinyin: py,
                        level: preset.level || null,
                        pos: preset.pos || existingPos || 'n',
                        hanViet: preset.hanViet || '',
                        meaning: preset.meaning || existingMeaning || '',
                        measure: (preset.measureCards || []).map(m => `${m.hanzi} (${m.pinyin} - ${m.hanViet})`).join(', '),
                        measureCards: preset.measureCards || [],
                        radicals: enrichedRadicals,
                        example: preset.example || buildNaturalDailyExample(hanzi, py, preset.pos || existingPos, preset.meaning || existingMeaning)
                    };
                }

                const radicals = chars.map(ch => enrichCharEntry(ch));
                const posClean = (existingPos || '').toLowerCase();
                const isVerbOrAdj = /\b(v|đgt|adj|tt|adv|phó|conj|liên|prep|giới|pron|đt)\b/.test(posClean);

                let matchedCards = [];
                if (!isVerbOrAdj) {
                    const rule = SMART_CLASSIFIER_RULES.find(r => r.regex.test(hanzi));
                    if (rule) {
                        matchedCards = rule.cards;
                    } else if (posClean.includes('n') || posClean.includes('dt')) {
                        matchedCards = [{ hanzi: '个', pinyin: 'gè', hanViet: 'CÁ' }];
                    }
                }

                const exampleObj = buildNaturalDailyExample(hanzi, py, existingPos, existingMeaning);

                return {
                    pinyin: py,
                    pos: existingPos || 'n',
                    hanViet: '',
                    meaning: existingMeaning || '',
                    measure: matchedCards.map(m => `${m.hanzi} (${m.pinyin} - ${m.hanViet})`).join(', '),
                    measureCards: matchedCards,
                    radicals,
                    example: exampleObj
                };
            }

            async function enrichWordWithGemini(hanzi, existingPy = '', existingPos = '', existingMeaning = '', forceAi = false) {
                const data = Storage.load();
                const apiKey = (data.settings?.geminiApiKey || '').trim();
                const fallback = buildSmartFallbackEnrich(hanzi, existingPy, existingPos, existingMeaning);

                if (!apiKey) {
                    if (forceAi) {
                        UI.showToast("Bạn chưa nhập Gemini API Key trong Cài đặt — đang dùng bộ phân tích thông minh tích hợp!", "info");
                    }
                    return fallback;
                }

                const prompt = `Bạn là giáo viên tiếng Trung HSK cho người Việt. Hãy phân tích chính xác từ vựng "${hanzi}" (pinyin: "${existingPy || fallback.pinyin}", nghĩa gợi ý: "${existingMeaning || ''}").
Yêu cầu bắt buộc:
1. "measureCards": Chỉ liệt kê các LƯỢNG TỪ THỰC SỰ DÙNG ĐƯỢC cho "${hanzi}" trong tiếng Trung hiện đại. Nếu là động từ, tính từ, phó từ hoặc không có lượng từ đi kèm, trả về mảng rỗng [].
2. "example": Tạo 1 câu ví dụ giao tiếp đời sống đơn giản, tự nhiên, thường dùng hàng ngày có chứa "${hanzi}", dịch tiếng Việt tự nhiên.
3. "radicals": Phân tích chi tiết từng chữ Hán trong "${hanzi}" gồm: bính âm từng chữ, hình thái kết cấu, lục thư, bộ thủ chính, tổng số nét, thứ tự nét bút cơ bản, danh sách "components" các bộ thành phần cấu tạo (kèm pinyin và âm Hán Việt viết hoa) và mẹo ghi nhớ ngắn gọn.
Trả về JSON đúng cấu trúc:
{
  "pinyin": "pinyin có dấu thanh",
  "pos": "dt, đgt, tt, phó, liên...",
  "hanViet": "ÂM HÁN VIỆT VIẾT HOA",
  "meaning": "nghĩa tiếng Việt chuẩn xác",
  "measureCards": [{"hanzi": "lượng từ", "pinyin": "pinyin", "hanViet": "HÁN VIỆT"}],
  "radicals": [{
    "char": "từng chữ Hán",
    "pinyin": "bính âm chữ đó",
    "structure": "hình thái cấu trúc",
    "liushu": "lục thư",
    "radical": "TÊN BỘ + chữ bộ",
    "strokes": 12,
    "strokeOrder": "一 丨 一 ...",
    "components": [{"char": "bộ thành phần", "pinyin": "pinyin", "hanViet": "HÁN VIỆT"}],
    "meaning": "mẹo ghi nhớ ngắn gọn"
  }],
  "example": {"cn": "câu ví dụ tiếng Trung chứa ${hanzi}", "py": "pinyin cả câu", "vi": "dịch nghĩa tiếng Việt"}
}`;

                const models = ['gemini-2.5-flash', 'gemini-2.0-flash'];
                for (const modelName of models) {
                    try {
                        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${encodeURIComponent(apiKey)}`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                contents: [{ parts: [{ text: prompt }] }],
                                generationConfig: { responseMimeType: "application/json" }
                            })
                        });

                        if (!res.ok) continue;
                        const json = await res.json();
                        const text = json.candidates?.[0]?.content?.parts?.[0]?.text || '{}';
                        const parsed = JSON.parse(text);
                        const cards = Array.isArray(parsed.measureCards) ? parsed.measureCards : fallback.measureCards;

                        return {
                            fromGemini: true,
                            pinyin: parsed.pinyin || fallback.pinyin,
                            pos: parsed.pos || fallback.pos,
                            hanViet: (parsed.hanViet || fallback.hanViet).toUpperCase(),
                            meaning: parsed.meaning || fallback.meaning,
                            measure: cards.map(m => `${m.hanzi} (${m.pinyin} - ${m.hanViet})`).join(', '),
                            measureCards: cards,
                            radicals: Array.isArray(parsed.radicals) && parsed.radicals.length > 0 ? parsed.radicals : fallback.radicals,
                            example: parsed.example?.cn ? parsed.example : fallback.example
                        };
                    } catch (e) {}
                }

                if (forceAi) {
                    UI.showToast("Không kết nối được Gemini API (kiểm tra lại API Key trong Cài đặt) — đã dùng dữ liệu phân tích thông minh.", "error");
                }
                return fallback;
            }

            return { BUILTIN_DICT, generatePinyin, speak, playFeedbackSound, enrichWordWithGemini, buildSmartFallbackEnrich };
        })();

        /* =====================================================================
           MODULE 3: PARSER (Tách file Word/TXT — Nhận diện đa dạng tiêu đề HSK 1-5 & Bài)
        ====================================================================== */
        const Parser = (() => {
            async function extractTextFromFile(file) {
                const name = (file.name || '').toLowerCase();
                if (name.endsWith('.docx') || name.endsWith('.docm')) {
                    if (!window.mammoth) throw new Error("Thư viện mammoth.js chưa tải xong, vui lòng thử lại.");
                    const arrayBuffer = await file.arrayBuffer();
                    const result = await window.mammoth.extractRawText({ arrayBuffer });
                    return (result.value || '').replace(/^\uFEFF/, '');
                }
                try {
                    const text = await file.text();
                    if (text && text.trim().length > 0) {
                        return text.replace(/^\uFEFF/, '');
                    }
                } catch (e) {}
                throw new Error("Không đọc được nội dung file. Vui lòng chọn file .docx, .docm hoặc .txt (UTF-8).");
            }

            function parseInlineExampleSegment(rawEx) {
                if (!rawEx) return null;
                const clean = rawEx.trim();
                const m1 = clean.match(/^(.+?[。！？!?；;…])\s*\(([^)]+)\)\s*[-–—]\s*(.+)$/);
                if (m1) {
                    return { cn: m1[1].trim(), py: m1[2].trim(), vi: m1[3].trim() };
                }
                const m2 = clean.match(/^([^(]+)\(([^)]+)\)\s*[-–—]\s*(.+)$/);
                if (m2 && /[\u4e00-\u9fa5]/.test(m2[1])) {
                    return { cn: m2[1].trim(), py: m2[2].trim(), vi: m2[3].trim() };
                }
                return null;
            }

            function parseInlineClassifiers(rawPart) {
                const match = rawPart.match(/[\[\【]\s*Lượng\s*từ\s*[:：]\s*([^\]\】]+)[\]\】]/i);
                if (!match) return { cleanedText: rawPart.trim(), measureCards: [], measureStr: '', hasTag: false };

                const cleanedText = rawPart.replace(match[0], '').trim();
                const items = match[1].split(/[,，、;；]/).map(s => s.trim()).filter(Boolean);
                const measureCards = [];

                for (const item of items) {
                    const m = item.match(/^([\u4e00-\u9fa5]+)\s*[\(\（]([^\)\）]+)[\)\）]/);
                    if (m) {
                        const hz = m[1].trim();
                        const py = m[2].trim();
                        measureCards.push({
                            hanzi: hz,
                            pinyin: py,
                            hanViet: ''
                        });
                    } else if (/[\u4e00-\u9fa5]/.test(item)) {
                        const hz = item.replace(/[^\u4e00-\u9fa5]/g, '').trim() || item;
                        measureCards.push({
                            hanzi: hz,
                            pinyin: DictionaryAI.generatePinyin(hz),
                            hanViet: ''
                        });
                    }
                }

                const CLASSIFIER_HV_MAP = {
                    '个': 'CÁ', '块': 'KHỐI', '片': 'PHIẾN', '袋': 'ĐẠI', '张': 'TRƯƠNG',
                    '幅': 'BỨC', '本': 'BẢN', '条': 'ĐIỀU', '只': 'CHÍCH', '双': 'SONG',
                    '棵': 'KHỎA', '株': 'CHU', '位': 'VỊ', '名': 'DANH', '间': 'GIAN',
                    '座': 'TỌA', '栋': 'ĐỐNG', '层': 'TẦNG', '把': 'BẢ', '顶': 'ĐỈNH',
                    '件': 'KIỆN', '瓶': 'BÌNH', '杯': 'BÔI', '罐': 'QUÁN', '种': 'CHỦNG',
                    '朵': 'ĐÓA', '束': 'THÚC', '盆': 'BỒN', '枝': 'CHI', '场': 'TRÀNG',
                    '次': 'THỨ', '届': 'GIỚI', '组': 'TỔ', '家': 'GIA', '盒': 'HẠP',
                    '批': 'PHÊ', '项': 'HẠNG', '副': 'PHÓ', '首': 'THỦ', '段': 'ĐOẠN',
                    '部': 'BỘ', '台': 'ĐÀI', '架': 'GIÁ', '头': 'ĐẦU', '群': 'QUẦN',
                    '门': 'MÔN', '处': 'XỨ', '套': 'SÁO', '盏': 'TRẢN', '班': 'BAN',
                    '趟': 'THẢNG', '列': 'LIỆT', '根': 'CĂN', '支': 'CHI', '箱': 'TƯƠNG',
                    '封': 'PHONG', '艘': 'TAO', '面': 'DIỆN', '份': 'PHẬN', '碗': 'OẢN',
                    '锅': 'OA', '轮': 'LUÂN', '弯': 'LOAN', '声': 'THANH', '道': 'ĐẠO',
                    '串': 'XUYẾN', '斤': 'CÂN', '对': 'ĐỐI', '匹': 'THẤT', '排': 'BÀI',
                    '粒': 'LẠP', '桩': 'THUNG', '缕': 'LŨ', '笔': 'BÚT', '叠': 'ĐIỆP',
                    '颗': 'KHỎA', '枚': 'MAI', '阵': 'TRẬN', '股': 'CỔ', '丝': 'TI',
                    '期': 'KỲ', '勺': 'THƯỚC', '克': 'KHẮC', '番': 'PHIÊN', '出': 'XUẤT',
                    '管': 'QUẢN', '捆': 'KHỔN', '顿': 'ĐỐN', '户': 'HỘ', '口': 'KHẨU',
                    '册': 'SÁCH', '身': 'THÂN', '笼': 'LUNG', '所': 'SỞ', '堂': 'ĐƯỜNG',
                    '节': 'TIẾT', '锭': 'ĐĨNH', '两': 'LƯỢNG', '堆': 'ĐÔI', '抹': 'MẠT',
                    '瓣': 'BIỆN', '步': 'BỘ', '任': 'NHIỆM', '起': 'KHỞI', '行': 'HÀNG',
                    '幕': 'MẠC', '捧': 'PHỦNG', '升': 'THĂNG', '桶': 'THÙNG'
                };
                measureCards.forEach(c => {
                    if (CLASSIFIER_HV_MAP[c.hanzi]) c.hanViet = CLASSIFIER_HV_MAP[c.hanzi];
                });

                const measureStr = measureCards.map(m => `${m.hanzi} (${m.pinyin}${m.hanViet ? ` - ${m.hanViet}` : ''})`).join(', ');
                return { cleanedText, measureCards, measureStr, hasTag: true };
            }

            function parseRawText(rawText, defaultLevel = 1) {
                const cleanRaw = String(rawText || '').replace(/^\uFEFF/, '');
                const lines = cleanRaw.split(/\r\n|\r|\n/).map(l => l.trim()).filter(Boolean);
                let currentLevel = parseInt(defaultLevel, 10) || 1;
                let currentLesson = 'Bài 1';
                const results = [];
                let activeHanziBlock = null;
                let inComponentsSection = false;

                // Kiểm tra chuỗi trong ngoặc có phải Pinyin hợp lệ không (tránh nhầm âm Hán Việt như "tư", "khẩu", "trảo", "tiết", "nghiễm" thành Pinyin)
                const isLikelyPinyin = (str) => {
                    const s = String(str || '').trim().toLowerCase();
                    if (!s) return false;
                    if (/[ăâđêôơưạảãàáầấậẩẫằắặẳẵẹẻẽèéềếệểễịỉĩìíọỏõòóồốộổỗờớợởỡụủũùúừứựửữỳýỵỷỹ]/i.test(s)) return true;
                    const syllables = s.split(/[\s'’\-]+/).filter(Boolean);
                    if (syllables.length === 0) return false;
                    const plainSyllables = syllables.map(syl =>
                        syl.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/ü/g, 'v')
                    );
                    const pyRegex = /^(zh|ch|sh|[bpmfdtnlgkhjqxrzcsyw])?(a|o|e|ai|ei|ao|ou|an|en|ang|eng|ong|i|ia|ie|iao|iu|ian|in|iang|ing|iong|u|ua|uo|uai|ui|uan|un|uang|ueng|v|ve|van|vn|er)$/i;
                    return plainSyllables.every(syl => pyRegex.test(syl));
                };

                for (let i = 0; i < lines.length; i++) {
                    const rawLine = lines[i];
                    const line = rawLine
                        .replace(/^[-•*▪➢►]+\s+/, '')
                        .replace(/^[\[\(【（#=*]+\s*(.+?)\s*[\]\)】）#=*]+$/, '$1')
                        .trim();

                    // 1. Nhận diện tiêu đề HSK & Bài
                    const headerMatch = line.match(/^hsk\s*([1-5])(?:\s*[-–—:|_.,/\\]\s*|\s+)?(.*)$/i);
                    if (headerMatch && !/[\u4e00-\u9fa5]/.test(line.replace(/bài|tập|phần|chương|quyển/gi, ''))) {
                        currentLevel = parseInt(headerMatch[1], 10);
                        const restTitle = (headerMatch[2] || '').replace(/[*#=_]+/g, '').trim();
                        if (restTitle) {
                            currentLesson = /^(?:bài|lesson|unit|chương)\b/i.test(restTitle) ? restTitle : `Bài ${restTitle}`;
                        } else {
                            currentLesson = 'Bài 1';
                        }
                        activeHanziBlock = null;
                        inComponentsSection = false;
                        continue;
                    }

                    const reverseHeaderMatch = line.match(/^(?:bài|lesson|unit)\s*([0-9a-zA-ZÀ-ỹ\s]+?)\s*[-–—:|(\[]\s*hsk\s*([1-5])\s*[\])]*$/i);
                    if (reverseHeaderMatch) {
                        currentLesson = `Bài ${reverseHeaderMatch[1].trim()}`;
                        currentLevel = parseInt(reverseHeaderMatch[2], 10);
                        activeHanziBlock = null;
                        inComponentsSection = false;
                        continue;
                    }

                    const lessonOnlyMatch = line.match(/^(?:bài|lesson|unit)\s*(\d+.*)$/i);
                    if (lessonOnlyMatch) {
                        const lessonLabel = lessonOnlyMatch[1].replace(/[*#=_]+/g, '').trim();
                        if (!/[。！？!?]/.test(lessonLabel) && lessonLabel.length < 45) {
                            currentLesson = `Bài ${lessonLabel}`;
                            activeHanziBlock = null;
                            inComponentsSection = false;
                            continue;
                        }
                    }

                    // 2. Nhận diện các dòng thuộc khối phân tích Hán tự của từ vựng ngay phía trên
                    const lastWord = results[results.length - 1];
                    if (lastWord) {
                        const wordChars = Array.from(lastWord.hanzi).filter(c => /[\u4e00-\u9fa5]/.test(c));

                        // Dòng tiêu đề 1 chữ Hán đơn (vd: "座", "位", "台")
                        if (/^[\u4e00-\u9fa5]$/.test(line)) {
                            const nextLine = (lines[i + 1] || '').trim();
                            const isFollowedByHanziMeta = /^(?:Bính\s*âm|Lục\s*thư|Bộ\s*thành\s*phần|Hình\s*thái|Số\s*nét)\s*[:：]/i.test(nextLine);
                            if (wordChars.includes(line) || isFollowedByHanziMeta) {
                                if (!lastWord._customHanziMap) lastWord._customHanziMap = {};
                                activeHanziBlock = lastWord._customHanziMap[line] || {
                                    char: line,
                                    pinyin: DictionaryAI.generatePinyin(line),
                                    liushu: '',
                                    components: [],
                                    meaning: ''
                                };
                                lastWord._customHanziMap[line] = activeHanziBlock;
                                lastWord.hasCustomHanzi = true;
                                inComponentsSection = false;
                            }
                            continue;
                        }

                        if (activeHanziBlock) {
                            const pyMatch = line.match(/^Bính\s*âm\s*[:：]\s*(.+)$/i);
                            if (pyMatch) {
                                activeHanziBlock.pinyin = pyMatch[1].trim();
                                inComponentsSection = false;
                                continue;
                            }

                            const lsMatch = line.match(/^Lục\s*thư\s*[:：]\s*(.+)$/i);
                            if (lsMatch) {
                                activeHanziBlock.liushu = lsMatch[1].trim();
                                inComponentsSection = false;
                                continue;
                            }

                            if (/^Bộ\s*thành\s*phần\s*[:：]?\s*$/i.test(line)) {
                                inComponentsSection = true;
                                continue;
                            }

                            const inlineCompHeader = line.match(/^Bộ\s*thành\s*phần\s*[:：]\s*(.+)$/i);
                            if (inlineCompHeader) {
                                inComponentsSection = true;
                                const sub = inlineCompHeader[1].trim();
                                const cm = sub.match(/^([\u4e00-\u9fa5\u2e80-\u2eff\u3400-\u4dbf])\s*(?:\(([^)]+)\))?(?:\s*[-–—:]\s*(.+))?$/);
                                if (cm) {
                                    activeHanziBlock.components.push({
                                        char: cm[1].trim(),
                                        pinyin: DictionaryAI.generatePinyin(cm[1].trim()),
                                        hanViet: (cm[2] || '').trim().toUpperCase(),
                                        desc: (cm[3] || '').trim()
                                    });
                                }
                                continue;
                            }

                            // Dòng chi tiết bộ thành phần: "厶 (tư) — riêng tư", "口 (khẩu) — miệng", "广 (nghiễm) — mái nhà (biểu ý)"
                            const compLineMatch = line.match(/^([\u4e00-\u9fa5\u2e80-\u2eff\u3400-\u4dbf])\s*(?:\(([^)]+)\))?(?:\s*[-–—:]\s*(.+))?$/);
                            if (compLineMatch && (inComponentsSection || compLineMatch[2] || compLineMatch[3])) {
                                const cChar = compLineMatch[1].trim();
                                const cHv = (compLineMatch[2] || '').trim().toUpperCase();
                                const cDesc = (compLineMatch[3] || '').trim();
                                activeHanziBlock.components.push({
                                    char: cChar,
                                    pinyin: DictionaryAI.generatePinyin(cChar),
                                    hanViet: cHv,
                                    desc: cDesc
                                });
                                continue;
                            }
                        }
                    }

                    // Bỏ qua các dòng bộ thủ / giải thích đơn lẻ bị lạc (vd: "厶 (tư) — riêng tư" hoặc "日 (nhật)")
                    const strayRadicalMatch = line.match(/^([\u4e00-\u9fa5\u2e80-\u2eff\u3400-\u4dbf])\s*\(([^)]+)\)\s*(?:[—–-]\s*(.+))?$/);
                    if (strayRadicalMatch) {
                        const innerParen = strayRadicalMatch[2].trim();
                        const tailDesc = (strayRadicalMatch[3] || '').trim();
                        const hasFullPosAndMeaning = /^[^-–—]+\s*[-–—]\s*[^-–—]+\s*[-–—]\s*.+$/.test(tailDesc);
                        if (!hasFullPosAndMeaning && !isLikelyPinyin(innerParen)) {
                            continue;
                        }
                    }

                    // Reset trạng thái khối Hán tự khi bắt đầu dòng từ vựng mới
                    activeHanziBlock = null;
                    inComponentsSection = false;

                    // 3. Phân tích dòng từ vựng chính (trích xuất [Lượng từ: ...] trước để không bị cắt lệch)
                    const { cleanedText: lineWithoutMeasure, measureCards: explicitMeasureCards, measureStr: explicitMeasureStr, hasTag: hasExplicitMeasureTag } = parseInlineClassifiers(line);

                    let leftVocabPart = lineWithoutMeasure;
                    let rightExamplePart = '';
                    const emDashIdx = lineWithoutMeasure.indexOf('—');
                    if (emDashIdx !== -1) {
                        leftVocabPart = lineWithoutMeasure.slice(0, emDashIdx).trim();
                        rightExamplePart = lineWithoutMeasure.slice(emDashIdx + 1).trim();
                    }

                    const parsedExample = parseInlineExampleSegment(rightExamplePart);
                    const vocabWithoutMeasure = leftVocabPart;

                    // Mẫu đầy đủ: Chữ Hán (pinyin) – loại từ – Âm Hán Việt – nghĩa tiếng Việt
                    const fullFormatMatch = vocabWithoutMeasure.match(/^([^(–—-]+)\s*\(([^)]+)\)\s*[-–—]\s*([^-–—]+)\s*[-–—]\s*([^-–—]+)\s*[-–—]\s*(.+)$/);
                    if (fullFormatMatch) {
                        const hanzi = fullFormatMatch[1].trim();
                        if (!/[\u4e00-\u9fa5]/.test(hanzi)) continue;

                        const pinyin = fullFormatMatch[2].trim();
                        const pos = UI.normalizePosToEnglish(fullFormatMatch[3].trim());
                        const hanViet = fullFormatMatch[4].trim().toUpperCase();
                        const meaning = fullFormatMatch[5].trim();
                        const autoEnriched = DictionaryAI.buildSmartFallbackEnrich(hanzi, pinyin, pos, meaning);

                        const finalMeasureCards = hasExplicitMeasureTag ? explicitMeasureCards : autoEnriched.measureCards;
                        const finalMeasureStr = hasExplicitMeasureTag ? explicitMeasureStr : autoEnriched.measure;

                        results.push({
                            hanzi,
                            pinyin,
                            level: currentLevel,
                            lesson: currentLesson,
                            pos: pos || autoEnriched.pos,
                            hanViet,
                            meaning,
                            measure: finalMeasureStr,
                            measureCards: finalMeasureCards,
                            hasCustomMeasure: hasExplicitMeasureTag,
                            radicals: autoEnriched.radicals,
                            example: parsedExample || autoEnriched.example,
                            isCustomExample: Boolean(parsedExample)
                        });
                        continue;
                    }

                    // Mẫu 2 thành phần: Chữ Hán (pinyin) – nghĩa tiếng Việt (bắt buộc phải có Pinyin hợp lệ và có nghĩa đi kèm)
                    const parenFormatMatch = vocabWithoutMeasure.match(/^([\u4e00-\u9fa5]+)\s*\(([^)]+)\)\s*[-–—:]\s*(.+)$/);
                    if (parenFormatMatch && isLikelyPinyin(parenFormatMatch[2])) {
                        const hanzi = parenFormatMatch[1].trim();
                        const pinyin = parenFormatMatch[2].trim();
                        const rest = (parenFormatMatch[3] || '').trim();
                        const autoEnriched = DictionaryAI.buildSmartFallbackEnrich(hanzi, pinyin, '', rest);

                        const finalMeasureCards = hasExplicitMeasureTag ? explicitMeasureCards : autoEnriched.measureCards;
                        const finalMeasureStr = hasExplicitMeasureTag ? explicitMeasureStr : autoEnriched.measure;

                        results.push({
                            hanzi,
                            pinyin,
                            level: currentLevel,
                            lesson: currentLesson,
                            pos: autoEnriched.pos,
                            hanViet: autoEnriched.hanViet,
                            meaning: rest || autoEnriched.meaning,
                            measure: finalMeasureStr,
                            measureCards: finalMeasureCards,
                            hasCustomMeasure: hasExplicitMeasureTag,
                            radicals: autoEnriched.radicals,
                            example: parsedExample || autoEnriched.example,
                            isCustomExample: Boolean(parsedExample)
                        });
                        continue;
                    }

                    // Mẫu phân tách bằng gạch ngang hoặc tab: Chữ Hán - pinyin - nghĩa
                    const parts = vocabWithoutMeasure.split(/\s*[-–—\t|]\s*/);
                    if (parts.length >= 2 && /[\u4e00-\u9fa5]/.test(parts[0])) {
                        const hanziMatch = parts[0].match(/([\u4e00-\u9fa5]+)/);
                        if (hanziMatch) {
                            const hanzi = hanziMatch[1].trim();
                            let pinyin = '';
                            let meaning = '';
                            if (parts.length >= 3) {
                                pinyin = parts[1].trim();
                                meaning = parts.slice(2).join(' - ').trim();
                            } else {
                                const second = parts[1].trim();
                                if (isLikelyPinyin(second)) {
                                    pinyin = second;
                                } else {
                                    meaning = second;
                                }
                            }

                            if (meaning || pinyin) {
                                const finalPy = pinyin || DictionaryAI.generatePinyin(hanzi);
                                const autoEnriched = DictionaryAI.buildSmartFallbackEnrich(hanzi, finalPy, '', meaning);

                                const finalMeasureCards = hasExplicitMeasureTag ? explicitMeasureCards : autoEnriched.measureCards;
                                const finalMeasureStr = hasExplicitMeasureTag ? explicitMeasureStr : autoEnriched.measure;

                                results.push({
                                    hanzi,
                                    pinyin: finalPy,
                                    level: currentLevel,
                                    lesson: currentLesson,
                                    pos: autoEnriched.pos,
                                    hanViet: autoEnriched.hanViet,
                                    meaning: meaning || autoEnriched.meaning,
                                    measure: finalMeasureStr,
                                    measureCards: finalMeasureCards,
                                    hasCustomMeasure: hasExplicitMeasureTag,
                                    radicals: autoEnriched.radicals,
                                    example: parsedExample || autoEnriched.example,
                                    isCustomExample: Boolean(parsedExample)
                                });
                            }
                        }
                    }
                }

                // Gắn kết khối phân tích Hán tự (座 / 位, Bính âm, Lục thư, Bộ thành phần) vào từng từ vựng
                for (const item of results) {
                    if (item._customHanziMap) {
                        const chars = Array.from(item.hanzi).filter(c => /[\u4e00-\u9fa5]/.test(c));
                        const existingRads = Array.isArray(item.radicals) ? item.radicals : [];
                        item.radicals = chars.map(ch => {
                            const custom = item._customHanziMap[ch];
                            const base = existingRads.find(r => r.char === ch) || {};
                            if (!custom) return base;
                            const compMeaning = (custom.components || [])
                                .map(c => `${c.char}${c.hanViet ? ` (${c.hanViet.toLowerCase()})` : ''}${c.desc ? ` — ${c.desc}` : ''}`)
                                .join(' • ');
                            return {
                                ...base,
                                char: ch,
                                pinyin: custom.pinyin || base.pinyin || DictionaryAI.generatePinyin(ch),
                                liushu: custom.liushu || base.liushu || '',
                                radical: custom.components?.[0]
                                    ? `${custom.components[0].hanViet || ''} ${custom.components[0].char}`.trim()
                                    : (base.radical || `Chữ ${ch}`),
                                components: custom.components && custom.components.length > 0 ? custom.components : (base.components || []),
                                meaning: compMeaning || base.meaning || ''
                            };
                        });
                        delete item._customHanziMap;
                    }
                }

                return results;
            }

            return { extractTextFromFile, parseRawText };
        })();

        /* =====================================================================
           MODULE 4: GITHUB CLOUD SYNC ENGINE (ĐỒNG BỘ 2 CHIỀU SIÊU MƯỢT + RETRY)
        ====================================================================== */
        const GitHubSync = (() => {
            const CONFIG_KEY = 'hsk_github_sync_cfg_v2';
            let syncStatus = 'unconfigured';
            let lastSyncTime = '';
            let pushTimer = null;
            let isPushingNow = false;
            let pendingPushData = null;

            function getConfig() {
                try {
                    const raw = localStorage.getItem(CONFIG_KEY);
                    if (!raw) return { token: '', owner: '', repo: '', branch: 'main', filePath: 'hsk_data.json' };
                    return { branch: 'main', filePath: 'hsk_data.json', ...JSON.parse(raw) };
                } catch (e) {
                    return { token: '', owner: '', repo: '', branch: 'main', filePath: 'hsk_data.json' };
                }
            }

            function saveConfig(cfg) {
                try {
                    localStorage.setItem(CONFIG_KEY, JSON.stringify(cfg));
                } catch (e) {}
            }

            function isConfigured() {
                const c = getConfig();
                return Boolean(c.token && c.owner && c.repo && c.filePath);
            }

            function utf8ToBase64(str) {
                const bytes = new TextEncoder().encode(str);
                const chunkSize = 0x8000;
                const chunks = [];
                for (let i = 0; i < bytes.length; i += chunkSize) {
                    chunks.push(String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize)));
                }
                return btoa(chunks.join(''));
            }

            function base64ToUtf8(base64) {
                const cleanB64 = base64.replace(/\s+/g, '');
                const binString = atob(cleanB64);
                const bytes = new Uint8Array(binString.length);
                for (let i = 0; i < binString.length; i++) {
                    bytes[i] = binString.charCodeAt(i);
                }
                return new TextDecoder().decode(bytes);
            }

            function setStatus(status, customMsg = '') {
                syncStatus = status;
                if (status === 'synced') {
                    const now = new Date();
                    lastSyncTime = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
                }
                const pill = document.getElementById('github-sync-pill');
                if (!pill) return;

                if (status === 'unconfigured') {
                    pill.className = 'px-2.5 py-1.5 rounded-full text-[11px] sm:text-xs font-extrabold border transition flex items-center gap-1 bg-slate-100 text-slate-600 border-slate-200 hover:bg-slate-200';
                    pill.innerHTML = `<i data-lucide="cloud-off" class="w-3.5 h-3.5 shrink-0"></i><span class="max-w-[95px] sm:max-w-none truncate">Chưa kết nối</span>`;
                } else if (status === 'syncing') {
                    pill.className = 'px-2.5 py-1.5 rounded-full text-[11px] sm:text-xs font-extrabold border transition flex items-center gap-1 bg-amber-50 text-amber-800 border-amber-300';
                    pill.innerHTML = `<i data-lucide="refresh-cw" class="w-3.5 h-3.5 animate-spin shrink-0"></i><span class="max-w-[95px] sm:max-w-none truncate">Đang đồng bộ...</span>`;
                } else if (status === 'synced') {
                    pill.className = 'px-2.5 py-1.5 rounded-full text-[11px] sm:text-xs font-extrabold border transition flex items-center gap-1 bg-emerald-50 text-emerald-800 border-emerald-300 hover:bg-emerald-100';
                    pill.innerHTML = `<i data-lucide="cloud-check" class="w-3.5 h-3.5 text-emerald-600 shrink-0"></i><span class="max-w-[110px] sm:max-w-none truncate">Đã đồng bộ ${lastSyncTime}</span>`;
                } else {
                    pill.className = 'px-2.5 py-1.5 rounded-full text-[11px] sm:text-xs font-extrabold border transition flex items-center gap-1 bg-rose-50 text-rose-700 border-rose-300 hover:bg-rose-100';
                    pill.innerHTML = `<i data-lucide="cloud-alert" class="w-3.5 h-3.5 shrink-0"></i><span class="max-w-[100px] sm:max-w-none truncate">${customMsg || 'Lỗi GitHub'}</span>`;
                }
                if (window.lucide) lucide.createIcons();
            }

            async function fetchRemoteFileAndSha(cfg) {
                const headers = {
                    'Authorization': `Bearer ${cfg.token}`,
                    'Accept': 'application/vnd.github+json',
                    'X-GitHub-Api-Version': '2022-11-28'
                };
                const url = `https://api.github.com/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}/contents/${encodeURIComponent(cfg.filePath)}?ref=${encodeURIComponent(cfg.branch)}&_nocache=${Date.now()}`;
                const res = await fetch(url, { headers, cache: 'no-store' });

                if (res.status === 404) {
                    return { exists: false, sha: null, contentObj: null };
                }
                if (!res.ok) {
                    const errBody = await res.json().catch(() => ({}));
                    throw new Error(errBody.message || `HTTP ${res.status}`);
                }

                const fileData = await res.json();
                let rawBase64 = fileData.content || '';

                if (!rawBase64 && fileData.sha) {
                    const blobUrl = `https://api.github.com/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}/git/blobs/${fileData.sha}?_nocache=${Date.now()}`;
                    const blobRes = await fetch(blobUrl, { headers, cache: 'no-store' });
                    if (!blobRes.ok) throw new Error(`Không tải được dữ liệu lớn (Blob HTTP ${blobRes.status})`);
                    const blobData = await blobRes.json();
                    rawBase64 = blobData.content || '';
                }

                const jsonStr = base64ToUtf8(rawBase64);
                const parsed = JSON.parse(jsonStr);
                return { exists: true, sha: fileData.sha, contentObj: parsed };
            }

            async function pullFromGitHub(silent = false) {
                if (!isConfigured()) {
                    setStatus('unconfigured');
                    return false;
                }
                if (isPushingNow) return false;
                if (silent && UI.isBusyEditing && UI.isBusyEditing()) return false;

                const cfg = getConfig();
                setStatus('syncing');

                try {
                    const remote = await fetchRemoteFileAndSha(cfg);

                    if (!remote.exists) {
                        await pushToGitHub(Storage.load(), silent);
                        return true;
                    }

                    const remoteData = remote.contentObj;
                    if (remoteData && Array.isArray(remoteData.words)) {
                        const localData = Storage.load();
                        if (!remoteData.settings?.geminiApiKey && localData.settings?.geminiApiKey) {
                            remoteData.settings = remoteData.settings || {};
                            remoteData.settings.geminiApiKey = localData.settings.geminiApiKey;
                        }
                        Storage.saveLocalOnly(remoteData);
                        setStatus('synced');
                        if (!silent) {
                            UI.showToast(`☁️ Đã đồng bộ từ GitHub (${remoteData.words.length} từ)!`, 'success');
                        }
                        UI.renderNoteSidebar();
                        UI.updateDailyDueBadge();
                        if (!UI.isBusyEditing || !UI.isBusyEditing()) {
                            UI.renderView();
                        }
                        return true;
                    }
                    throw new Error("Cấu trúc file JSON trên GitHub không hợp lệ.");
                } catch (err) {
                    setStatus('error', 'Lỗi tải');
                    if (!silent) UI.showToast(`Lỗi tải GitHub: ${err.message}`, 'error');
                    return false;
                }
            }

            async function pushToGitHub(dataObj, silent = true, retryCount = 0) {
                if (!isConfigured()) {
                    setStatus('unconfigured');
                    return false;
                }

                if (isPushingNow && retryCount === 0) {
                    pendingPushData = dataObj;
                    return true;
                }

                isPushingNow = true;
                const cfg = getConfig();
                setStatus('syncing');

                try {
                    const headers = {
                        'Authorization': `Bearer ${cfg.token}`,
                        'Accept': 'application/vnd.github+json',
                        'X-GitHub-Api-Version': '2022-11-28'
                    };
                    const apiUrl = `https://api.github.com/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}/contents/${encodeURIComponent(cfg.filePath)}`;

                    let sha = null;
                    const checkRes = await fetch(`${apiUrl}?ref=${encodeURIComponent(cfg.branch)}&_nocache=${Date.now()}`, {
                        headers,
                        cache: 'no-store'
                    });
                    if (checkRes.ok) {
                        const existing = await checkRes.json();
                        sha = existing.sha;
                    } else if (checkRes.status !== 404) {
                        const errCheck = await checkRes.json().catch(() => ({}));
                        throw new Error(errCheck.message || `Kiểm tra repo thất bại (HTTP ${checkRes.status})`);
                    }

                    const cleanPayload = JSON.parse(JSON.stringify(dataObj));
                    if (cleanPayload.settings && cleanPayload.settings.geminiApiKey) {
                        cleanPayload.settings.geminiApiKey = '';
                    }
                    if (Array.isArray(cleanPayload.words)) {
                        cleanPayload.words.forEach(w => {
                            if (!w.aiEnriched && !w.hasCustomHanzi) {
                                delete w.radicals;
                            }
                            if (!w.aiEnriched && !w.isCustomExample) {
                                delete w.example;
                            }
                            if (Array.isArray(w.measureCards) && w.measureCards.length === 0) {
                                delete w.measureCards;
                                delete w.measure;
                            }
                            if (w.srs && w.srs.box === 0 && !w.srs.lastReviewed && !w.srs.correct && !w.srs.wrong) {
                                delete w.srs;
                            }
                        });
                    }
                    cleanPayload.lastUpdated = new Date().toISOString();

                    const jsonString = JSON.stringify(cleanPayload);
                    const contentBase64 = utf8ToBase64(jsonString);

                    if (contentBase64.length < 900000) {
                        const body = {
                            message: `Sync STUDY HSK (${cleanPayload.words?.length || 0} words)`,
                            content: contentBase64,
                            branch: cfg.branch
                        };
                        if (sha) body.sha = sha;

                        const putRes = await fetch(apiUrl, {
                            method: 'PUT',
                            headers: {
                                ...headers,
                                'Content-Type': 'application/json'
                            },
                            cache: 'no-store',
                            body: JSON.stringify(body)
                        });

                        if ((putRes.status === 409 || putRes.status === 422) && retryCount < 3) {
                            isPushingNow = false;
                            await new Promise(r => setTimeout(r, 350));
                            return await pushToGitHub(dataObj, silent, retryCount + 1);
                        }

                        if (!putRes.ok) {
                            const errJson = await putRes.json().catch(() => ({}));
                            throw new Error(errJson.message || `HTTP ${putRes.status}`);
                        }
                    } else {
                        const repoBase = `https://api.github.com/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}`;
                        const refRes = await fetch(`${repoBase}/git/ref/heads/${encodeURIComponent(cfg.branch)}?_nocache=${Date.now()}`, { headers, cache: 'no-store' });
                        if (!refRes.ok) throw new Error(`Không đọc được nhánh ${cfg.branch} (HTTP ${refRes.status})`);
                        const refData = await refRes.json();
                        const latestCommitSha = refData.object.sha;

                        const commitRes = await fetch(`${repoBase}/git/commits/${latestCommitSha}?_nocache=${Date.now()}`, { headers, cache: 'no-store' });
                        const commitData = await commitRes.json();
                        const baseTreeSha = commitData.tree.sha;

                        const blobRes = await fetch(`${repoBase}/git/blobs`, {
                            method: 'POST',
                            headers: { ...headers, 'Content-Type': 'application/json' },
                            body: JSON.stringify({ content: contentBase64, encoding: 'base64' })
                        });
                        if (!blobRes.ok) throw new Error(`Tạo Blob thất bại (HTTP ${blobRes.status})`);
                        const blobData = await blobRes.json();

                        const treeRes = await fetch(`${repoBase}/git/trees`, {
                            method: 'POST',
                            headers: { ...headers, 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                base_tree: baseTreeSha,
                                tree: [{ path: cfg.filePath, mode: '100644', type: 'blob', sha: blobData.sha }]
                            })
                        });
                        if (!treeRes.ok) throw new Error(`Tạo Tree thất bại (HTTP ${treeRes.status})`);
                        const treeData = await treeRes.json();

                        const newCommitRes = await fetch(`${repoBase}/git/commits`, {
                            method: 'POST',
                            headers: { ...headers, 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                message: `Sync STUDY HSK (${cleanPayload.words?.length || 0} words)`,
                                tree: treeData.sha,
                                parents: [latestCommitSha]
                            })
                        });
                        if (!newCommitRes.ok) throw new Error(`Tạo Commit thất bại (HTTP ${newCommitRes.status})`);
                        const newCommitData = await newCommitRes.json();

                        const updateRefRes = await fetch(`${repoBase}/git/refs/heads/${encodeURIComponent(cfg.branch)}`, {
                            method: 'PATCH',
                            headers: { ...headers, 'Content-Type': 'application/json' },
                            body: JSON.stringify({ sha: newCommitData.sha })
                        });
                        if (!updateRefRes.ok) {
                            if (retryCount < 3) {
                                isPushingNow = false;
                                await new Promise(r => setTimeout(r, 350));
                                return await pushToGitHub(dataObj, silent, retryCount + 1);
                            }
                            throw new Error(`Cập nhật nhánh thất bại (HTTP ${updateRefRes.status})`);
                        }
                    }

                    isPushingNow = false;
                    setStatus('synced');
                    if (!silent) UI.showToast('☁️ Đã lưu & đồng bộ lên GitHub thành công!', 'success');

                    if (pendingPushData) {
                        const nextData = pendingPushData;
                        pendingPushData = null;
                        await pushToGitHub(nextData, true, 0);
                    }
                    return true;
                } catch (err) {
                    isPushingNow = false;
                    if (retryCount < 2) {
                        await new Promise(r => setTimeout(r, 500));
                        return await pushToGitHub(dataObj, silent, retryCount + 1);
                    }
                    pendingPushData = null;
                    setStatus('error', 'Lỗi lưu');
                    UI.showToast(`Lỗi lưu lên GitHub: ${err.message}`, 'error');
                    return false;
                }
            }

            function scheduleAutoPush(dataObj) {
                if (!isConfigured()) return;
                setStatus('syncing');
                if (pushTimer) clearTimeout(pushTimer);
                pushTimer = setTimeout(() => {
                    pushToGitHub(dataObj, true, 0);
                }, 500);
            }

            function generateMagicSyncUrl() {
                const cfg = getConfig();
                if (!cfg.owner || !cfg.repo || !cfg.token) return '';
                const payload = utf8ToBase64(JSON.stringify(cfg))
                    .replace(/\+/g, '-')
                    .replace(/\//g, '_')
                    .replace(/=+$/, '');
                const baseUrl = window.location.origin + window.location.pathname;
                return `${baseUrl}#sync=${payload}`;
            }

            function checkAndImportMagicLinkFromUrl() {
                try {
                    const hash = window.location.hash || '';
                    const match = hash.match(/sync=([A-Za-z0-9\-_]+)/);
                    if (!match) return false;

                    let b64 = match[1].replace(/-/g, '+').replace(/_/g, '/');
                    while (b64.length % 4) b64 += '=';
                    const decoded = JSON.parse(base64ToUtf8(b64));
                    if (decoded && decoded.owner && decoded.repo && decoded.token) {
                        saveConfig({
                            owner: decoded.owner,
                            repo: decoded.repo,
                            branch: decoded.branch || 'main',
                            filePath: decoded.filePath || 'hsk_data.json',
                            token: decoded.token
                        });
                        window.history.replaceState(null, '', window.location.pathname + '#home');
                        return true;
                    }
                } catch (e) {}
                return false;
            }

            return {
                getConfig,
                saveConfig,
                isConfigured,
                getStatus: () => syncStatus,
                getLastSyncTime: () => lastSyncTime,
                setStatus,
                pullFromGitHub,
                pushToGitHub,
                scheduleAutoPush,
                generateMagicSyncUrl,
                checkAndImportMagicLinkFromUrl
            };
        })();

        /* =====================================================================
           MODULE 5: STORAGE (Kho dữ liệu nén gọn + Tự động đồng bộ GitHub)
        ====================================================================== */
        const Storage = (() => {
            const STORAGE_KEY = 'hsk_master_vn_empty_cloud_v2';
            let memoryFallback = null;
            let isLocalStorageAvailable = true;

            function getDefaultData() {
                const today = SRS.getTodayStr();
                return {
                    words: [],
                    decks: [],
                    dailyProgress: {
                        lastCompletedDate: null,
                        streak: 0,
                        onlineDates: [today],
                        todayNewIds: [],
                        todayReviewIds: [],
                        generatedDate: today,
                        selectedMonth: today.slice(0, 7),
                        selectedDate: today,
                        dailyFolders: {},
                        history: {}
                    },
                    matchRecords: [],
                    settings: {
                        geminiApiKey: '',
                        dailyNewHsk5: 22,
                        dailyReviewPerLevel: 5,
                        reminderTime: '20:00',
                        reminderEnabled: false,
                        speechRate: 1.0
                    }
                };
            }

            function saveLocalOnly(data) {
                memoryFallback = data;
                try {
                    if (data && Array.isArray(data.words)) {
                        data.words.forEach(w => {
                            if (!w.aiEnriched && !w.hasCustomHanzi) {
                                delete w.radicals;
                            }
                            if (!w.aiEnriched && !w.isCustomExample) {
                                delete w.example;
                            }
                            if (Array.isArray(w.measureCards) && w.measureCards.length === 0 && !w.hasCustomMeasure) {
                                delete w.measureCards;
                                delete w.measure;
                            }
                            if (w.srs && w.srs.box === 0 && !w.srs.lastReviewed && !w.srs.correct && !w.srs.wrong) {
                                delete w.srs;
                            }
                        });
                    }
                    const packedForLocal = {
                        ...data,
                        _packedWords: Array.isArray(data.words)
                            ? data.words.map(w => {
                                let flags = 0;
                                if (w.starred) flags |= 1;
                                if (w.mastered) flags |= 2;
                                if (w.isDailyOnly) flags |= 4;
                                if (w.aiEnriched) flags |= 8;
                                if (w.hasCustomHanzi) flags |= 16;
                                if (w.isCustomExample) flags |= 32;
                                if (w.hasCustomMeasure) flags |= 64;
                                return [
                                    w.id, w.hanzi, w.pinyin || '', w.level || 1, w.lesson || 'Bài 1',
                                    w.pos || '', w.hanViet || '', w.meaning || '',
                                    flags,
                                    w.measureCards || null, w.radicals || null, w.example || null, w.srs || null
                                ];
                            })
                            : []
                    };
                    delete packedForLocal.words;
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(packedForLocal));
                    isLocalStorageAvailable = true;
                    document.getElementById('storage-warning')?.classList.add('hidden');
                } catch (e) {
                    isLocalStorageAvailable = false;
                    document.getElementById('storage-warning')?.classList.remove('hidden');
                }
            }

            function load() {
                if (memoryFallback) {
                    return memoryFallback;
                }
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (!raw) {
                        const def = getDefaultData();
                        saveLocalOnly(def);
                        return def;
                    }
                    const parsed = JSON.parse(raw);
                    if (Array.isArray(parsed._packedWords)) {
                        parsed.words = parsed._packedWords.map(arr => {
                            const isNewFormat = arr.length === 13;
                            const flags = isNewFormat ? arr[8] : 0;
                            const w = isNewFormat ? {
                                id: arr[0], hanzi: arr[1], pinyin: arr[2], level: arr[3], lesson: arr[4],
                                pos: arr[5], hanViet: arr[6], meaning: arr[7],
                                starred: Boolean(flags & 1),
                                mastered: Boolean(flags & 2)
                            } : {
                                id: arr[0], hanzi: arr[1], pinyin: arr[2], level: arr[3], lesson: arr[4],
                                pos: arr[5], hanViet: arr[6], meaning: arr[7],
                                starred: Boolean(arr[8]), mastered: Boolean(arr[9])
                            };
                            if (isNewFormat) {
                                if (flags & 4) w.isDailyOnly = true;
                                if (flags & 8) w.aiEnriched = true;
                                if (flags & 16) w.hasCustomHanzi = true;
                                if (flags & 32) w.isCustomExample = true;
                                if (flags & 64) w.hasCustomMeasure = true;
                                if (arr[9]) {
                                    w.measureCards = arr[9];
                                    w.measure = arr[9].map(m => `${m.hanzi} (${m.pinyin}${m.hanViet ? ` - ${m.hanViet}` : ''})`).join(', ');
                                }
                                if (arr[10]) w.radicals = arr[10];
                                if (arr[11]) w.example = arr[11];
                                if (arr[12]) w.srs = arr[12];
                            } else {
                                if (arr[10]) w.isDailyOnly = true;
                                if (arr[11]) w.aiEnriched = true;
                                if (arr[12]) {
                                    w.measureCards = arr[12];
                                    w.measure = arr[12].map(m => `${m.hanzi} (${m.pinyin}${m.hanViet ? ` - ${m.hanViet}` : ''})`).join(', ');
                                }
                                if (arr[13]) w.radicals = arr[13];
                                if (arr[14]) w.example = arr[14];
                                if (arr[15]) w.srs = arr[15];
                            }
                            return w;
                        });
                        delete parsed._packedWords;
                    }
                    memoryFallback = parsed;
                    return parsed;
                } catch (e) {
                    isLocalStorageAvailable = false;
                    document.getElementById('storage-warning')?.classList.remove('hidden');
                    if (!memoryFallback) memoryFallback = getDefaultData();
                    return memoryFallback;
                }
            }

            function save(data, immediatePush = false) {
                saveLocalOnly(data);
                if (immediatePush && GitHubSync.isConfigured()) {
                    GitHubSync.pushToGitHub(data, true, 0);
                } else {
                    GitHubSync.scheduleAutoPush(data);
                }
            }

            function reset() {
                const def = getDefaultData();
                save(def, true);
                return def;
            }

            return { load, save, saveLocalOnly, reset, isAvailable: () => isLocalStorageAvailable };
        })();

        /* =====================================================================
           MODULE 6: FLASHCARD ENGINE (QUIZLET MODE)
        ====================================================================== */
        const FlashcardModule = (() => {
            let state = {
                sourceType: 'all',
                sourceValue: '',
                shuffle: false,
                trackProgress: true,
                showHint: false,
                cards: [],
                historyStack: [],
                currentIndex: 0,
                isFlipped: false,
                sessionKnown: 0,
                sessionUnknown: 0,
                touchStartX: 0
            };

            function getDeckWords(sourceType, sourceValue) {
                const data = Storage.load();
                let list = [];
                if (sourceType === 'deck') {
                    const deck = data.decks.find(d => d.id === sourceValue);
                    if (deck) {
                        list = deck.wordIds.map(id => data.words.find(w => w.id === id)).filter(Boolean);
                    }
                } else if (sourceType === 'level') {
                    const lvl = parseInt(sourceValue, 10);
                    list = data.words.filter(w => w.level === lvl);
                } else if (sourceType === 'lesson') {
                    const [lvlStr, ...lessonParts] = sourceValue.split('|');
                    const lvl = parseInt(lvlStr, 10);
                    const lessonName = lessonParts.join('|');
                    list = data.words.filter(w => w.level === lvl && (w.lesson || 'Bài 1') === lessonName);
                } else if (sourceType === 'starred') {
                    list = data.words.filter(w => w.starred);
                } else if (sourceType === 'daily_date') {
                    const folderIds = data.dailyProgress.dailyFolders?.[sourceValue]?.wordIds || data.dailyProgress.history?.[sourceValue] || [];
                    list = folderIds.map(id => data.words.find(w => w.id === id)).filter(Boolean);
                } else if (sourceType === 'daily') {
                    const selDate = data.dailyProgress.selectedDate || SRS.getTodayStr();
                    const folderIds = data.dailyProgress.dailyFolders?.[selDate]?.wordIds || [...(data.dailyProgress.todayNewIds || []), ...(data.dailyProgress.todayReviewIds || [])];
                    list = folderIds.map(id => data.words.find(w => w.id === id)).filter(Boolean);
                } else {
                    list = [...data.words];
                }
                return list;
            }

            function initSession(sourceType = 'all', sourceValue = '', shuffle = false) {
                let words = getDeckWords(sourceType, sourceValue);
                if (shuffle) {
                    words = [...words].sort(() => Math.random() - 0.5);
                }
                state = {
                    ...state,
                    sourceType,
                    sourceValue,
                    shuffle,
                    showHint: false,
                    cards: words,
                    historyStack: [],
                    currentIndex: 0,
                    isFlipped: false,
                    sessionKnown: 0,
                    sessionUnknown: 0
                };
            }

            function flip() {
                if (state.cards.length === 0) return;
                state.isFlipped = !state.isFlipped;
                UI.renderFlashcardCardOnly();
            }

            function toggleHint() {
                state.showHint = !state.showHint;
                UI.renderFlashcardCardOnly();
            }

            function toggleTrackProgress() {
                state.trackProgress = !state.trackProgress;
                UI.renderFlashcardCardOnly();
            }

            function undo() {
                if (state.historyStack.length === 0) return;
                const prev = state.historyStack.pop();
                state.currentIndex = prev.index;
                state.sessionKnown = prev.known;
                state.sessionUnknown = prev.unknown;
                state.isFlipped = false;
                state.showHint = false;
                UI.renderView();
            }

            function answer(isKnown) {
                if (state.currentIndex >= state.cards.length) return;
                state.historyStack.push({
                    index: state.currentIndex,
                    known: state.sessionKnown,
                    unknown: state.sessionUnknown
                });

                const currentCard = state.cards[state.currentIndex];
                const data = Storage.load();
                const wordInDb = data.words.find(w => w.id === currentCard.id);

                if (wordInDb && state.trackProgress) {
                    SRS.recordReview(wordInDb, isKnown);
                    if (!isKnown) {
                        wordInDb.starred = true;
                        state.sessionUnknown++;
                    } else {
                        state.sessionKnown++;
                    }
                    Storage.save(data);
                    UI.renderNoteSidebar();
                    UI.updateDailyDueBadge();
                } else {
                    if (!isKnown) state.sessionUnknown++;
                    else state.sessionKnown++;
                }

                state.currentIndex++;
                state.isFlipped = false;
                state.showHint = false;

                if (state.currentIndex >= state.cards.length && state.sourceType === 'deck') {
                    const deck = data.decks.find(d => d.id === state.sourceValue);
                    if (deck) {
                        SRS.reviewDeck(deck);
                        Storage.save(data);
                    }
                }

                UI.renderView();
            }

            function toggleStarCurrent() {
                if (state.currentIndex >= state.cards.length) return;
                const currentCard = state.cards[state.currentIndex];
                UI.toggleStar(currentCard.id);
                UI.renderFlashcardCardOnly();
            }

            return {
                getState: () => state,
                initSession,
                flip,
                toggleHint,
                toggleTrackProgress,
                undo,
                answer,
                toggleStarCurrent,
                setTouchStart: (x) => { state.touchStartX = x; },
                handleTouchEnd: (endX) => {
                    const diff = endX - state.touchStartX;
                    if (Math.abs(diff) > 55) {
                        if (diff < 0) answer(false);
                        else answer(true);
                    }
                }
            };
        })();

        /* =====================================================================
           MODULE 7: QUIZ & LEARN ENGINE (Học ngắt quãng từng cụm 10 từ & Kiểm tra)
        ====================================================================== */
        const QuizModule = (() => {
            const CHUNK_SIZE = 10;
            let state = {
                active: false,
                mode: 'quiz',
                sourceType: 'all',
                sourceValue: '',
                learnTwoStage: false,
                currentStage: 1,
                chunkIndex: 1,
                remainingPool: [],
                currentChunkWords: [],
                chunkFailedMap: {},
                selectedWords: [],
                questions: [],
                currentIndex: 0,
                score: 0,
                wrongWords: [],
                answeredCurrent: false,
                lastAnswerCorrect: false,
                lastUserAnswer: '',
                config: {
                    count: 20,
                    mc: true,
                    written: false,
                    tf: false,
                    match: false
                }
            };

            function getWordsFromSource(sourceType, sourceValue) {
                const data = Storage.load();
                if (sourceType === 'deck') {
                    const deck = data.decks.find(d => d.id === sourceValue);
                    return deck ? deck.wordIds.map(id => data.words.find(w => w.id === id)).filter(Boolean) : [];
                } else if (sourceType === 'level') {
                    return data.words.filter(w => w.level === parseInt(sourceValue, 10));
                } else if (sourceType === 'lesson') {
                    const [lvlStr, ...lessonParts] = sourceValue.split('|');
                    const lessonName = lessonParts.join('|');
                    return data.words.filter(w => w.level === parseInt(lvlStr, 10) && (w.lesson || 'Bài 1') === lessonName);
                } else if (sourceType === 'daily_date') {
                    const folderIds = data.dailyProgress.dailyFolders?.[sourceValue]?.wordIds || [];
                    return folderIds.map(id => data.words.find(w => w.id === id)).filter(Boolean);
                } else if (sourceType === 'starred') {
                    return data.words.filter(w => w.starred);
                }
                return [...data.words];
            }

            function formatPosAndMeaning(word) {
                const posPrefix = word.pos ? `(${word.pos}) ` : '';
                const meaningText = word.meaning || word.hanViet || '(Chưa có nghĩa)';
                return `${posPrefix}${meaningText}`;
            }

            function buildQuestionsForWords(words, allPool, allowedTypes) {
                const questions = [];
                let i = 0;
                while (i < words.length) {
                    const qType = allowedTypes[i % allowedTypes.length];
                    if (qType === 'match' && words.length - i >= 3) {
                        const groupSize = Math.min(4, words.length - i);
                        const group = words.slice(i, i + groupSize);
                        questions.push({
                            type: 'match',
                            word: group[0],
                            group,
                            leftItems: group.map(w => ({ id: w.id, hanzi: w.hanzi, pinyin: w.pinyin })).sort(() => Math.random() - 0.5),
                            rightItems: group.map(w => ({ id: w.id, pos: w.pos || '', meaning: w.meaning || w.hanViet || w.pinyin })).sort(() => Math.random() - 0.5),
                            selectedLeft: null,
                            selectedRight: null,
