                    cn: document.getElementById('edit-ex-cn').value.trim(),
                    py: document.getElementById('edit-ex-py').value.trim(),
                    vi: document.getElementById('edit-ex-vi').value.trim()
                };
                w.isCustomExample = Boolean(w.example.cn);

                Storage.save(data, true);
                renderNoteSidebar();
                renderView();
                closeWordModal();
                showToast("Đã cập nhật thông tin từ vựng!", "success");
            }

            async function triggerAiEnrich(wordId) {
                const data = Storage.load();
                const w = data.words.find(item => item.id === wordId);
                if (!w) return;

                const currentPos = document.getElementById('edit-pos')?.value.trim() || w.pos;
                const currentMeaning = document.getElementById('edit-meaning')?.value.trim() || w.meaning;
                const currentPinyin = document.getElementById('edit-pinyin')?.value.trim() || w.pinyin;

                const btn = document.getElementById('btn-ai-enrich');
                if (btn) {
                    btn.disabled = true;
                    btn.innerHTML = `<span>⏳ Đang phân tích AI...</span>`;
                }

                try {
                    const enriched = await DictionaryAI.enrichWordWithGemini(w.hanzi, currentPinyin, currentPos, currentMeaning, true);
                    w.pinyin = currentPinyin || enriched.pinyin;
                    w.pos = normalizePosToEnglish(currentPos || enriched.pos);
                    if (!w.hanViet && enriched.hanViet) w.hanViet = enriched.hanViet;
                    w.meaning = currentMeaning || enriched.meaning;
                    w.measureCards = enriched.measureCards || [];
                    w.measure = enriched.measure || '';
                    w.radicals = enriched.radicals || [];
                    w.example = enriched.example || w.example;
                    if (enriched.fromGemini) w.aiEnriched = true;

                    Storage.save(data);
                    renderNoteSidebar();
                    renderView();
                    openWordModal(wordId, true);
                    if (enriched.fromGemini) {

                const data = Storage.load();
                const newWord = {
                    id: 'w_' + Date.now(),
                    hanzi,
                    pinyin: document.getElementById('new-pinyin').value.trim() || DictionaryAI.generatePinyin(hanzi),
                    level: parseInt(document.getElementById('new-level').value, 10),
                    lesson: document.getElementById('new-lesson').value.trim() || 'Bài 1',
                    pos: '',
                    hanViet: '',
                    meaning: document.getElementById('new-meaning').value.trim(),
                    measure: '',
                    measureCards: [],
                    radicals: [],
                    example: { cn: '', py: '', vi: '' },
                    starred: false,
                    mastered: false,
                    srs: { box: 0, firstLearned: null, lastReviewed: null, nextDue: SRS.getTodayStr(), correct: 0, wrong: 0 }
                };
                data.words.unshift(newWord);
                Storage.save(data);
                updateDailyDueBadge();
                renderView();
                openWordModal(newWord.id);
            }

            /* -----------------------------------------------------------------
               MODAL TRA CỨU TỪ NHANH
            ----------------------------------------------------------------- */
            function openSearchModal() {
                const modal = document.getElementById('search-modal');
                const input = document.getElementById('global-search-input');
                if (!modal || !input) return;
                modal.classList.remove('hidden');
                modal.classList.add('flex');
                input.value = '';
                handleGlobalSearch('');
                setTimeout(() => input.focus(), 50);
            }

            function closeSearchModal() {
                const modal = document.getElementById('search-modal');
                if (modal) {
                    modal.classList.add('hidden');
                    modal.classList.remove('flex');
                }
            }

            function handleGlobalSearch(query) {
                const resContainer = document.getElementById('global-search-results');
                if (!resContainer) return;
                const data = Storage.load();
                const q = query.trim().toLowerCase();

                const matches = q
                    ? data.words.filter(w =>
                        w.hanzi.includes(q) ||
                        (w.pinyin || '').toLowerCase().includes(q) ||
                        (w.meaning || '').toLowerCase().includes(q) ||
                        (w.hanViet || '').toLowerCase().includes(q)
                    ).slice(0, 15)
                    : data.words.slice(0, 8);

                if (matches.length === 0) {
                    resContainer.innerHTML = `<div class="p-6 text-center text-xs text-slate-500">Không tìm thấy từ nào khớp "${query}" trong kho từ hiện tại.</div>`;
                    return;
                }

                resContainer.innerHTML = matches.map(w => `
                    <div onmouseenter="UI.setActiveHanzi('${w.hanzi}')" onclick="UI.closeSearchModal(); UI.openWordModal('${w.id}')" class="p-3 hover:bg-emerald-50/70 rounded-2xl cursor-pointer flex items-center justify-between transition">
                        <div>
                            <div class="flex items-center gap-2">
                                <span class="font-hanzi text-xl font-bold text-slate-900">${w.hanzi}</span>
                                <span class="text-xs font-bold text-emerald-700">${w.pinyin}</span>
                                <span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${LEVEL_COLORS[w.level]?.soft}">HSK ${w.level}</span>
                            </div>
                            <p class="text-xs text-slate-600 mt-0.5">${w.hanViet ? `[${w.hanViet}] ` : ''}${w.meaning || ''}</p>
                        </div>
                        <button onclick="event.stopPropagation(); DictionaryAI.speak('${w.hanzi}')" class="p-2 rounded-full hover:bg-emerald-100 text-emerald-700">
                            <i data-lucide="volume-2" class="w-4 h-4"></i>
                        </button>
                    </div>
                `).join('');
                lucide.createIcons();
            }

            function updateDailyDueBadge() {
                const dailyBadge = document.getElementById('daily-due-badge');
                if (dailyBadge) {
                    dailyBadge.classList.add('hidden');
                }
            }

            /* -----------------------------------------------------------------
               PHÍM TẮT TOÀN CỤC, TỰ ĐỘNG ĐỒNG BỘ KHI QUAY LẠI TAB/IPHONE & NHẮC NHỞ
            ----------------------------------------------------------------- */
            function setupKeyboardShortcuts() {
                document.addEventListener('click', (e) => {
                    const wrapper = document.getElementById('fc-dropdown-wrapper');
                    const menu = document.getElementById('fc-dropdown-menu');
                    if (wrapper && menu && !wrapper.contains(e.target)) {
                        menu.classList.add('hidden');
                    }

                    const qWrapper = document.getElementById('quiz-dropdown-wrapper');
                    const qMenu = document.getElementById('quiz-dropdown-menu');
                    if (qWrapper && qMenu && !qWrapper.contains(e.target)) {
                        qMenu.classList.add('hidden');
                    }
                });

                document.addEventListener('keydown', (e) => {
                    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
                        e.preventDefault();
                        openSearchModal();
                        return;
                    }
                    if (e.key === 'Escape') {
                        closeSearchModal();
                        closeWordModal();
                        return;
                    }

                    if (e.altKey && e.key === 'ArrowLeft') {
                        e.preventDefault();
                        goBack();
                        return;
                    }
                    if (e.altKey && e.key === 'ArrowRight') {
                        e.preventDefault();
                        goForward();
                        return;
                    }

                    const activeTag = document.activeElement?.tagName;
                    if (activeTag === 'INPUT' || activeTag === 'TEXTAREA' || activeTag === 'SELECT') return;

                    if (e.key.toLowerCase() === 'q') {
                        e.preventDefault();
                        speakCurrentContextWord();
                        return;
                    }

                    if (currentView === 'quiz') {
                        const qSt = QuizModule.getState();
                        if (qSt.active && qSt.answeredCurrent && e.key === 'ArrowRight') {
                            e.preventDefault();
                            QuizModule.next();
                            return;
                        }
                    }

                    if (currentView === 'flashcard') {
                        if (e.code === 'Space') {
                            e.preventDefault();
                            FlashcardModule.flip();
                        } else if (e.key === 'ArrowLeft') {
                            e.preventDefault();
                            FlashcardModule.answer(false);
                        } else if (e.key === 'ArrowRight') {
                            e.preventDefault();
                            FlashcardModule.answer(true);
                        } else if (e.key.toLowerCase() === 's') {
                            e.preventDefault();
                            FlashcardModule.toggleStarCurrent();
                        }
                    }
                });
            }

            function setupAutoSyncListeners() {
                let lastPullTimestamp = Date.now();
                const triggerPullIfStale = () => {
                    if (!GitHubSync.isConfigured()) return;
                    if (isBusyEditing()) return;
                    if (Date.now() - lastPullTimestamp > 5000) {
                        lastPullTimestamp = Date.now();
                        GitHubSync.pullFromGitHub(true);
                    }
                };

                document.addEventListener('visibilitychange', () => {
                    if (document.visibilityState === 'visible') {
                        triggerPullIfStale();
                    }
                });

                window.addEventListener('focus', () => {
                    triggerPullIfStale();
                });
            }

            function setActiveHanzi(hanzi) {
                if (hanzi) currentActiveHanzi = hanzi;
            }

            function speakCurrentContextWord() {
                if (activeModalHanzi) {
                    DictionaryAI.speak(activeModalHanzi);
                    return;
                }
                if (currentView === 'flashcard') {
                    const st = FlashcardModule.getState();
                    const card = st.cards[st.currentIndex];
                    if (card?.hanzi) {
                        DictionaryAI.speak(card.hanzi);
                        return;
                    }
                }
                if (currentView === 'quiz') {
                    const qSt = QuizModule.getState();
                    const q = qSt.questions?.[qSt.currentIndex];
                    if (q?.word?.hanzi) {
                        DictionaryAI.speak(q.word.hanzi);
                        return;
                    }
                }
                if (currentView === 'match') {
                    const mSt = MatchGame.getState();
                    if (mSt.selectedLeft) {
                        const found = mSt.leftItems.find(i => i.id === mSt.selectedLeft);
                        if (found?.hanzi) {
                            DictionaryAI.speak(found.hanzi);
                            return;
                        }
                    }
                }
                if (currentActiveHanzi) {
                    DictionaryAI.speak(currentActiveHanzi);
                }
            }

            function initReminderChecker() {
                setInterval(() => {
                    const data = Storage.load();
                    if (!data.settings.reminderEnabled || Notification.permission !== 'granted') return;
                    const now = new Date();
                    const hhmm = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
                    if (hhmm === data.settings.reminderTime && now.getSeconds() < 10) {
                        new Notification("⏰ Đến giờ ôn từ vựng HSK!", {
                            body: "Mở STUDY HSK 1-5 để hoàn thành mục tiêu hôm nay nhé!"
                        });
                    }
                }, 10000);
            }

            async function init() {
                const importedMagic = GitHubSync.checkAndImportMagicLinkFromUrl();

                initHistorySync();
                setupKeyboardShortcuts();
                setupAutoSyncListeners();
                initReminderChecker();
                renderNoteSidebar();
                updateDailyDueBadge();
                switchView('home', {}, { isInitial: true });

                if (GitHubSync.isConfigured()) {
                    await GitHubSync.pullFromGitHub(!importedMagic);
                    if (importedMagic) {
                        showToast("✅ Đã tự động kết nối & đồng bộ dữ liệu sang thiết bị này!", "success");
                    }
                } else {
                    GitHubSync.setStatus('unconfigured');
                }
            }

            return {
                init,
                isBusyEditing,
                normalizePosToEnglish,
                switchView,
                goBack,
                goForward,
                renderView,
                renderNoteSidebar,
                updateDailyDueBadge,
                renderFlashcardCardOnly,
                showToast,
                handleSyncPillClick,
                saveAndConnectGitHub,
                copyMagicSyncLink,
                setActiveHanzi,
                toggleStar,
                toggleMastered,
                launchStudyMode,
                setHskFilter,
                deleteLessonWords,
                deleteAllWordsInLevel,
                selectDailyMonth,
                selectDailyDate,
                createNewDayFolderPrompt,
                deleteDailyFolder,
                addQuickWordToDailyFolder,
                importFileToDailyFolder,
                removeWordFromDailyFolder,
                autoFillDailyFolder,
                completeDailyFolderStudy,
                toggleFcDropdown,
                toggleQuizDropdown,
                toggleSubflyout,
                selectQuizCascadeSource,
                selectFlashcardSource,
                toggleFlashcardShuffle,
                onQuizSourceChange,
                startQuizFromForm,
                startMatchFromForm,
                startMatchFromLast,
                toggleDeckNameBox,
                handleFileSelected,
                parsePastedText,
                updatePendingWord,
                confirmSaveUploadedWords,
                downloadSampleTxt,
                saveSettings,
                requestNotificationPermission,
                exportJsonBackup,
                importJsonBackup,
                confirmResetData,
                selectModalRadicalChar,
                openWordModal,
                closeWordModal,
                saveWordEdits,
                triggerAiEnrich,
                openAddWordModal,
                createNewWord,
                openSearchModal,
                closeSearchModal,
                handleGlobalSearch
            };
        })();

        window.addEventListener('DOMContentLoaded', () => {
            UI.init();
        });
    </script>
</body>
</html>
